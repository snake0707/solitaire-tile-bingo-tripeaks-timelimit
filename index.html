<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Solitaire Tile</title>
    <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
    <div id="game-container">
        <!-- Header -->
        <div id="header">
            <button id="btn-highlight" title="拖动高亮">H</button>
            <button id="btn-zh" title="中文模式">中</button>
            <div id="level-label">Level 1</div>
            <button id="menu-btn">&#9776;</button>
        </div>

        <!-- Steps Bar (simplified, no bingo) -->
        <div id="steps-bar">
            <div id="steps-display">
                <span id="steps-icon">&#128099;</span>
                <span id="steps-count">0</span>
            </div>
        </div>

        <!-- Hand Card Area (draw pile) -->
        <div id="hand-area">
            <div id="hand-display"></div>
            <div id="hand-pile"></div>
        </div>

        <!-- Collector Slots -->
        <div id="collectors"></div>

        <!-- Tableau (solitaire columns) -->
        <div id="tableau"></div>

        <!-- Bottom Bar -->
        <div id="bottom-bar">
            <button class="bottom-btn" id="btn-hint" title="Hint">&#128161;</button>
            <button class="bottom-btn" id="btn-undo" title="Undo">&#8617;</button>
        </div>
    </div>

    <!-- Win Overlay -->
    <div id="win-overlay" class="hidden">
        <div id="win-dialog">
            <h2>&#127881; You Win! &#127881;</h2>
            <p id="win-message">You completed the level!</p>
            <button id="btn-next-level">Next Level</button>
        </div>
    </div>

    <!-- Lose Overlay -->
    <div id="lose-overlay" class="hidden">
        <div id="lose-dialog">
            <h2>Game Over</h2>
            <p id="lose-message">No more moves available!</p>
            <button id="btn-continue">+10 Steps</button>
            <button id="btn-retry">Retry</button>
        </div>
    </div>

    <!-- Soft Deadlock Overlay -->
    <div id="soft-deadlock-overlay" class="hidden">
        <div id="soft-deadlock-dialog">
            <h2>Stuck!</h2>
            <p id="soft-deadlock-message">No moves left to complete this level.</p>
            <button id="btn-sd-rescue">Rescue</button>
            <button id="btn-sd-retry">Retry</button>
        </div>
    </div>

    <!-- Level Select Overlay -->
    <div id="level-overlay" class="hidden">
        <div id="level-dialog">
            <h2>Select Level</h2>
            <div id="level-grid"></div>
            <button id="btn-close-levels">Cancel</button>
        </div>
    </div>

    <script src="categories.js"></script>
    <script src="level_settings.js"></script>
    <script src="level_card_defs.js"></script>
    <script src="color_settings.js"></script>
    <script src="game.js?v=12"></script>
</body>
</html>
