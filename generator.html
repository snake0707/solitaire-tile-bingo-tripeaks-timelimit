        nodesExplored,
    };
}

// ─── Layout Generation ────────────────────────────────────────────

/**
 * Run a greedy playout (no backtracking) and check if it gets soft-deadlocked within maxSteps.
 * Returns { softDead: bool, stepsUsed: int, won: bool }
 */
function greedyDeadlockCheck(tableau, categoryTargets, maxSteps, maxSlots, handPile, conservative) {
    const result = solveLevel(tableau, categoryTargets, maxSteps, maxSlots, handPile, conservative || false, true, true);
    // If won → not deadlocked; if stepsUsed < maxSteps and not won → deadlocked
    const softDead = !result.won && result.stepsUsed < maxSteps;
    return { softDead, stepsUsed: result.stepsUsed, won: result.won };
}

function generateSolvableLayout(level) {
    const config = getLevelSettings(level);
    const catDefs = LEVEL_CARD_DEFS[level];
    if (!catDefs) {
        throw new Error('No card definitions found for level ' + level);
    }

    // Use solveStepMax as solver step limit, displaySteps for player output
    const solveStepMin = config.solveStepMin;
    const solveStepMax = config.solveStepMax;
    const maxSolverSteps = solveStepMax; // 用上限作为求解器步数限制
    const displaySteps = config.maxSteps;

    const difficulty = document.getElementById('difficulty').value;

    const maxAttempts = 2000;
    let difficultySkips = 0;

    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const gen = generateCards(level);

        // 布局质量检查
        if (!validateLayout(gen.tableau, gen.handPile, gen.categoryTargets, config.maxSlots)) {
            continue;
        }

        // 求解（优先策略+均等策略回溯）
        const result = solveLevel(gen.tableau, gen.categoryTargets, maxSolverSteps, config.maxSlots, gen.handPile, false, false, false, displaySteps, true);

        if (!result.won) continue;

        // 难度过滤: easy=priority通过, hard=equality通过
        if (difficulty === 'easy' && result.strategyType !== 'priority') { difficultySkips++; continue; }
        if (difficulty === 'hard' && result.strategyType !== 'equality') { difficultySkips++; continue; }

        const stepsUsed = result.stepsUsed;
        if (stepsUsed < solveStepMin || stepsUsed > solveStepMax) {
            continue;
        }

        // 条件2: 策略2（保守, priority only）有解且步数在 [solveStepMin, solveStepMax]
        const result2 = solveLevel(gen.tableau, gen.categoryTargets, maxSolverSteps, config.maxSlots, gen.handPile, true, true, false, displaySteps);
        if (!result2.won || result2.strategyType === 'priority-greedy') continue;
        const solver2Steps = result2.stepsUsed;
        if (solver2Steps < solveStepMin || solver2Steps > solveStepMax) continue;
        const solver2StrategyType = result2.strategyType;

        // 条件3: 策略1纯贪心在 displaySteps 内不被软卡死
        const check1 = greedyDeadlockCheck(gen.tableau, gen.categoryTargets, displaySteps, config.maxSlots, gen.handPile, false);
        if (check1.softDead) continue;

        // 条件4: 策略2纯贪心在 displaySteps 内不被软卡死
        const check2 = greedyDeadlockCheck(gen.tableau, gen.categoryTargets, displaySteps, config.maxSlots, gen.handPile, true);
        if (check2.softDead) continue;

        return {
            layout: {
                config: {
                    maxSlots: config.maxSlots,
                    maxSteps: displaySteps,
                    strategyType: result.strategyType,
                    solverSteps: stepsUsed,
                    solverMaxSteps: maxSolverSteps,
                    moveStats: result.moveStats,
                    solver2Steps,
                    solver2StrategyType,
                    solver2Stats: result2.moveStats,
                },
                tableau: gen.tableau.map(col => col.map(tc => ({
                    card: { ...tc.card },
                    faceUp: tc.faceUp,
                }))),
                categoryTargets: { ...gen.categoryTargets },
                handPile: gen.handPile.map(c => ({ ...c })),
                handDisplay: [],
            },
            attempts: attempt + 1,
            stepsUsed,
            maxSteps: displaySteps,
            solveStepMax: maxSolverSteps,
            strategyType: result.strategyType,
            movePath: result.movePath || [],
            movePath2: result2.movePath || [],
            solver2Steps,
            solver2StrategyType,
            difficultySkips,
        };
    }
    return { layout: null, attempts: maxAttempts, difficultySkips };
}

function downloadJSON(filename, data) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function downloadTextFile(filename, text) {
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function formatSolutionLog(level, layoutIdx, totalLayouts, layout, movePath, stepsUsed, strategyType) {
    const config = layout.config;
    const lines = [];

    lines.push('========================================');
    lines.push(`Level ${level}, Layout ${layoutIdx + 1}/${totalLayouts}`);
    lines.push('========================================');
    lines.push(`Config: slots=${config.maxSlots}, maxSteps=${config.maxSteps}, solverSteps=${stepsUsed}, strategyType=${strategyType}`);

    // Tableau
    lines.push('Tableau:');
    layout.tableau.forEach((col, i) => {
        const cards = col.map(tc => {
            const flag = tc.faceUp ? '\u2191' : '\u2193';
            const ctype = tc.card.type === 'gold' ? 'G' : 'R';
            return `${flag}${ctype}:${tc.card.name}`;
        });
        lines.push(`  Col ${i}: ${cards.join(' | ')}`);
    });
    lines.push(`Hand: ${layout.handPile.length} cards`);
    lines.push(`Categories: ${JSON.stringify(layout.categoryTargets)}`);
    lines.push('');

    if (!movePath || !movePath.length) {
        lines.push('(no movePath recorded)');
        return lines.join('\n');
    }

    lines.push(`=== solved ${stepsUsed} steps (${strategyType}) ===`);
    lines.push('');

    // Replay movePath with state tracking
    const state = {
        tableau: layout.tableau.map(col => col.map(tc => ({ card: { ...tc.card }, faceUp: tc.faceUp }))),
        slots: new Array(config.maxSlots).fill(null),
        completedCount: 0,
        numCategories: Object.keys(layout.categoryTargets).length,
        handPile: layout.handPile.map(c => ({ ...c })),
        handDisplay: [],
        recycleCount: 0,
    };
    const categoryTargets = layout.categoryTargets;

    function slotsStr() {
        return '[' + state.slots.map(s => {
            if (!s) return '___';
            return `${s.key.substring(0, 8)}(${s.collected}/${s.target})`;
        }).join(', ') + ']';
    }

    function describeMove(move) {
        const mt = move.type;
        if (mt === 'tableau_multi_to_slot') {
            const col = state.tableau[move.colIdx];
            const si = move.startIdx || 0;
            const names = col.slice(si).map(c => c.card.name);
            return `Col${move.colIdx}\u2192Slot(multi) [${names.join(', ')}]`;
        } else if (mt === 'tableau_to_slot') {
            const col = state.tableau[move.colIdx];
            return `Col${move.colIdx}\u2192Slot [${col[col.length - 1].card.name}]`;
        } else if (mt === 'tableau_gold_to_slot') {
            const col = state.tableau[move.colIdx];
            return `Col${move.colIdx}\u2192Slot(gold) [${col[col.length - 1].card.name}]`;
        } else if (mt === 'display_to_slot') {
            return `Hand\u2192Slot [${state.handDisplay[state.handDisplay.length - 1].name}]`;
        } else if (mt === 'display_gold_to_slot') {
            return `Hand\u2192Slot(gold) [${state.handDisplay[state.handDisplay.length - 1].name}]`;
        } else if (mt === 'tableau_to_column') {
            const col = state.tableau[move.srcCol];
            return `Col${move.srcCol}\u2192Col${move.dstCol} [${col[col.length - 1].card.name}]`;
        } else if (mt === 'tableau_multi_to_column') {
            const si = move.startIdx || 0;
            const names = state.tableau[move.srcCol].slice(si).map(c => c.card.name);
            return `Col${move.srcCol}\u2192Col${move.dstCol}(multi) [${names.join(', ')}]`;
        } else if (mt === 'display_to_column') {
            return `Hand\u2192Col${move.dstCol} [${state.handDisplay[state.handDisplay.length - 1].name}]`;
        } else if (mt === 'flip_hand') {
            return `Flip [${state.handPile[state.handPile.length - 1].name}]`;
        } else if (mt === 'recycle') {
            return `Recycle (${state.handDisplay.length} cards)`;
        }
        return mt;
    }

    function autoFlip(col) {
        if (col.length > 0 && !col[col.length - 1].faceUp) {
            col[col.length - 1].faceUp = true;
        }
    }

    function replayMove(move) {
        const mt = move.type;
        if (mt === 'tableau_multi_to_slot') {
            const col = state.tableau[move.colIdx];
            const si = move.startIdx || 0;
            const removed = col.splice(si);
            const top = removed[removed.length - 1];
            const bottom = removed[0];
            const gold = top.card.type === 'gold' ? top : (bottom.card.type === 'gold' ? bottom : null);
            if (gold) {
                const ei = state.slots.indexOf(null);
                const rc = removed.length - 1;
                const t = categoryTargets[gold.card.category] || 0;
                state.slots[ei] = { key: gold.card.category, collected: rc, target: t };
                if (rc >= t) { state.slots[ei] = null; state.completedCount++; }
            } else {
                for (let si2 = 0; si2 < state.slots.length; si2++) {
                    const s = state.slots[si2];
                    if (s && s.key === top.card.category) {
                        s.collected += removed.length;
                        if (s.collected >= s.target) { state.slots[si2] = null; state.completedCount++; }
                        break;
                    }
                }
            }
            autoFlip(col);
        } else if (mt === 'tableau_to_slot') {
            const col = state.tableau[move.colIdx];
            const card = col.pop();
            for (let si = 0; si < state.slots.length; si++) {
                const s = state.slots[si];
                if (s && s.key === card.card.category) {
                    s.collected++;
                    if (s.collected >= s.target) { state.slots[si] = null; state.completedCount++; }
                    break;
                }
            }
            autoFlip(col);
        } else if (mt === 'tableau_gold_to_slot') {
            const col = state.tableau[move.colIdx];
            const card = col.pop();
            const ei = state.slots.indexOf(null);
            state.slots[ei] = { key: card.card.category, collected: 0, target: categoryTargets[card.card.category] || 0 };
            autoFlip(col);
        } else if (mt === 'display_to_slot') {
            const card = state.handDisplay.pop();
            for (let si = 0; si < state.slots.length; si++) {
                const s = state.slots[si];
                if (s && s.key === card.category) {
                    s.collected++;
                    if (s.collected >= s.target) { state.slots[si] = null; state.completedCount++; }
                    break;
                }
            }
        } else if (mt === 'display_gold_to_slot') {
            const card = state.handDisplay.pop();
            const ei = state.slots.indexOf(null);
            state.slots[ei] = { key: card.category, collected: 0, target: categoryTargets[card.category] || 0 };
        } else if (mt === 'tableau_to_column') {
            const src = state.tableau[move.srcCol];
            const tc = src.pop();
            state.tableau[move.dstCol].push(tc);
            autoFlip(src);
        } else if (mt === 'tableau_multi_to_column') {
            const src = state.tableau[move.srcCol];
            const si = move.startIdx || 0;
            const removed = src.splice(si);
            state.tableau[move.dstCol].push(...removed);
            autoFlip(src);
        } else if (mt === 'display_to_column') {
            const card = state.handDisplay.pop();
            state.tableau[move.dstCol].push({ card, faceUp: true });
        } else if (mt === 'flip_hand') {
            const card = state.handPile.pop();
            state.handDisplay.push(card);
        } else if (mt === 'recycle') {
            state.handPile = [...state.handDisplay].reverse();
            state.handDisplay = [];
            state.recycleCount++;
        }
    }

    lines.push(`--- Solution Path (${movePath.length} steps) ---`);
    lines.push('');
    for (let i = 0; i < movePath.length; i++) {
        const move = movePath[i];
        const desc = describeMove(move);
        const step = String(i + 1).padStart(4);
        lines.push(`${step}. ${desc}  Slots=${slotsStr()}`);
        replayMove(move);
    }

    if (state.completedCount >= state.numCategories) {
        lines.push('');
        lines.push(`Solved! ${movePath.length} steps`);
    } else {
        lines.push('');
        lines.push(`Replay error: ${state.completedCount}/${state.numCategories} categories completed`);
    }

    return lines.join('\n');
}

// ─── UI ────────────────────────────────────────────────────────────

const btnGenerate = document.getElementById('btn-generate');
const progressFill = document.getElementById('progress-fill');
const progressLabel = document.getElementById('progress-label');
const logEl = document.getElementById('log');

function log(msg) {
    logEl.textContent += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
}

function setProgress(pct, label) {
    progressFill.style.width = pct + '%';
    progressLabel.textContent = label;
}

btnGenerate.addEventListener('click', async () => {
    const startLevel = parseInt(document.getElementById('start-level').value, 10) || 1;
    const numLevels = parseInt(document.getElementById('num-levels').value, 10) || 2;
    const layoutsPerLevel = parseInt(document.getElementById('layouts-per-level').value, 10) || 5;

    btnGenerate.disabled = true;
    logEl.textContent = '';
    log(`Starting generation: levels ${startLevel}-${startLevel + numLevels - 1}, ${layoutsPerLevel} layouts each`);

    const totalWork = numLevels * layoutsPerLevel;
    let completed = 0;

    for (let lv = startLevel; lv < startLevel + numLevels; lv++) {
        const layouts = [];
        const cfg = getLevelSettings(lv);
        const catDefs = LEVEL_CARD_DEFS[lv];
        if (!catDefs) {
            log(`\n--- Level ${lv}: NO CARD DEFINITIONS FOUND, skipping ---`);
            completed += layoutsPerLevel;
            continue;
        }
        const catNames = catDefs.map(d => d.categoryName).join(', ');
        log(`\n--- Level ${lv} (${cfg.numColumns} cols, ${cfg.totalColumnCards} tableau cards, ${cfg.maxSlots} slots, ${catDefs.length} cats: ${catNames}) ---`);

        const layoutResults = []; // Store movePath and metadata for solution log

        for (let i = 0; i < layoutsPerLevel; i++) {
            setProgress((completed / totalWork) * 100, `Level ${lv}: layout ${i + 1}/${layoutsPerLevel}`);

            await new Promise(r => setTimeout(r, 0));

            try {
                const result = generateSolvableLayout(lv);
                if (result.layout) {
                    layouts.push(result.layout);
                    layoutResults.push({
                        movePath: result.movePath,
                        stepsUsed: result.stepsUsed,
                        strategyType: result.strategyType,
                        movePath2: result.movePath2,
                        solver2Steps: result.solver2Steps,
                        solver2StrategyType: result.solver2StrategyType,
                    });
                    const totalCards = result.layout.tableau.reduce((s, c) => s + c.length, 0);
                    log(`  Layout ${i + 1}: solved by ${result.strategyType} (${totalCards} tableau + ${result.layout.handPile.length} hand, ${result.stepsUsed}/${result.solveStepMax} steps, display=${result.maxSteps}, ${result.attempts} attempts)`);

                    // Print move stats
                    const formatStats = (stats) => {
                        const labels = [
                            ['colSingleToSlot', '列→槽(单)'],
                            ['colMultiToSlot', '列→槽(多)'],
                            ['colToCol', '列→列(单)'],
                            ['colMultiToCol', '列→列(多)'],
                            ['handToSlot', '手→槽'],
                            ['handToCol', '手→列'],
                            ['flip', '翻牌'],
                            ['recycle', '回收'],
                        ];
                        return labels.filter(([k]) => (stats[k] || 0) > 0).map(([k, l]) => `${l}=${stats[k]}`).join(', ') || '(none)';
                    };
                    log(`    ops: ${formatStats(result.layout.config.moveStats)}`);
                    // Strategy 2 log
                    if (result.solver2Steps > 0) {
                        log(`    策略2(保守): ${result.solver2Steps} steps by ${result.solver2StrategyType}`);
                        log(`    策略2 ops: ${formatStats(result.layout.config.solver2Stats)}`);
                    } else {
                        log(`    策略2(保守): Priority无解, 输出${result.movePath2 ? result.movePath2.length : 0}步贪心路径`);
                    }
                } else {
                    log(`  Layout ${i + 1}: FAILED after ${result.attempts} attempts (${result.difficultySkips || 0} difficulty-filtered)`);
                }
            } catch (e) {
                log(`  Layout ${i + 1}: ERROR - ${e.message}`);
                console.error(e);
            }
            completed++;
        }

        if (layouts.length > 0) {
            downloadJSON(`level_${lv}.json`, layouts);
            log(`  Downloaded level_${lv}.json (${layouts.length} layouts)`);

            // Generate and download solution log
            const logParts = [];
            for (let li = 0; li < layouts.length; li++) {
                const lr = layoutResults[li];
                if (lr) {
                    logParts.push(formatSolutionLog(
                        lv, li, layouts.length, layouts[li],
                        lr.movePath, lr.stepsUsed, lr.strategyType
                    ));
                    // Strategy 2 solution log — always output path (solved or 300-step greedy playout)
                    if (lr.movePath2 && lr.movePath2.length > 0) {
                        const s2label = lr.solver2Steps > 0
                            ? lr.solver2StrategyType + ' (conservative)'
                            : lr.solver2StrategyType + ' (conservative, FAILED)';
                        const s2steps = lr.solver2Steps > 0 ? lr.solver2Steps : lr.movePath2.length;
                        logParts.push(formatSolutionLog(
                            lv, li, layouts.length, layouts[li],
                            lr.movePath2, s2steps, s2label
                        ));
                    } else {
                        logParts.push(`=== Level ${lv} Layout ${li + 1} - Strategy 2 (conservative): UNSOLVABLE ===`);
                    }
                }
            }
            if (logParts.length > 0) {
                downloadTextFile(`level_${lv}_solutions.txt`, logParts.join('\n\n\n'));
                log(`  Downloaded level_${lv}_solutions.txt`);
            }
        } else {
            log(`  WARNING: No solvable layouts found for level ${lv}`);
        }
    }

    setProgress(100, 'Done!');
    log('\nGeneration complete!');
    btnGenerate.disabled = false;
});
