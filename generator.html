<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitaire Tile - Level Generator (SAJLike)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #ffd700;
        }
        .config {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .config label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        .config input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            margin-bottom: 14px;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row > div { flex: 1; }
        button#btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
        }
        button#btn-generate:active { transform: scale(0.97); }
        button#btn-generate:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .progress-container {
            margin-top: 20px;
        }
        .progress-bar-outer {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #81c784);
            border-radius: 6px;
            width: 0%;
            transition: width 0.15s ease;
        }
        .progress-label {
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
        #log {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 14px;
            margin-top: 16px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Level Generator (SAJLike)</h1>
        <div class="config">
            <div class="row">
                <div>
                    <label for="start-level">Start Level</label>
                    <input type="number" id="start-level" value="1" min="1" max="108">
                </div>
                <div>
                    <label for="num-levels">Number of Levels</label>
                    <input type="number" id="num-levels" value="2" min="1" max="108">
                </div>
            </div>
            <div class="row">
                <div>
                    <label for="step-min-ratio">Step Min Ratio</label>
                    <input type="number" id="step-min-ratio" value="0.0" min="0" max="1" step="0.05">
                </div>
                <div>
                    <label for="step-max-ratio">Step Max Ratio</label>
                    <input type="number" id="step-max-ratio" value="1.0" min="0" max="1" step="0.05">
                </div>
            </div>
            <label for="layouts-per-level">Layouts per Level</label>
            <input type="number" id="layouts-per-level" value="5" min="1" max="20">
            <label for="mcts-iterations">MCTS Iterations</label>
            <input type="number" id="mcts-iterations" value="5000" min="100" max="50000" step="500">
            <div class="row">
                <div>
                    <label for="difficulty">Difficulty</label>
                    <select id="difficulty">
                        <option value="any">Any</option>
                        <option value="easy">Easy (greedy wins)</option>
                        <option value="hard">Hard (greedy fails)</option>
                    </select>
                </div>
            </div>
            <button id="btn-generate">Generate Levels</button>
        </div>
        <div class="progress-container">
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progress-fill"></div>
            </div>
            <div class="progress-label" id="progress-label">Ready</div>
        </div>
        <div id="log"></div>
    </div>

<script src="level_card_defs.js"></script>
<script src="level_settings.js"></script>
<script>
// ─── Generation Logic ──────────────────────────────────────────────

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function generateCards(level) {
    const config = getLevelSettings(level);
    const catDefs = LEVEL_CARD_DEFS[level];
    if (!catDefs) {
        throw new Error('No card definitions found for level ' + level);
    }

    const goldCards = [];
    const regularCards = [];
    const categoryTargets = {};

    for (const def of catDefs) {
        const catKey = def.isImage ? def.categoryName : def.categoryName + '_word';

        // Gold card
        goldCards.push({
            type: 'gold',
            category: catKey,
            name: def.categoryName,
            isText: !def.isImage,
        });

        // Regular cards
        categoryTargets[catKey] = def.cardWords.length;
        for (const word of def.cardWords) {
            if (def.isImage) {
                regularCards.push({
                    type: 'regular',
                    category: catKey,
                    name: word.name,
                    image: word.image,
                    isText: false,
                });
            } else {
                const wordName = typeof word === 'string' ? word : word.name;
                regularCards.push({
                    type: 'regular',
                    category: catKey,
                    name: wordName,
                    isText: true,
                });
            }
        }
    }

    const allCards = [...regularCards, ...goldCards];
    shuffleArray(allCards);

    const totalColumnCards = config.totalColumnCards;
    const tableauCards = allCards.slice(0, totalColumnCards);
    const handCards = allCards.slice(totalColumnCards);

    // Build tableau columns
    const tableau = [];
    let cardIdx = 0;
    for (let ci = 0; ci < config.numColumns; ci++) {
        const colSize = config.columnSizes[ci];
        const col = [];
        for (let pos = 0; pos < colSize; pos++) {
            if (cardIdx >= tableauCards.length) break;
            const card = tableauCards[cardIdx++];
            const isFaceUp = (pos === colSize - 1);
            col.push({ card, faceUp: isFaceUp });
        }
        tableau.push(col);
    }

    return { tableau, categoryTargets, handPile: handCards };
}

// ─── Heuristic Solver (SAJLike solitaire rules) ──────────────────────────

function canStackOnColumn(card, col) {
    if (col.length === 0) return true;
    const topCard = col[col.length - 1];
    if (topCard.card.type === 'gold') return false; // sealed
    return card.category === topCard.card.category;
}

function verifySolvable(tableau, categoryTargets, maxSteps, maxSlots, handPile, mctsIterations) {
    if (mctsIterations === undefined) mctsIterations = 5000;

    // Deep clone state
    const state = {
        tableau: tableau.map(col => col.map(tc => ({ card: { ...tc.card }, faceUp: tc.faceUp }))),
        slots: new Array(maxSlots).fill(null),
        stepsLeft: maxSteps,
        completedCount: 0,
        numCategories: Object.keys(categoryTargets).length,
        handPile: [...handPile].map(c => ({ ...c })),
        handDisplay: [],
        recycleCount: 0,
    };

    let nodesExplored = 0;
    const MAX_NODES = 2000000;
    const MAX_RECYCLES = 3;
    const EXPLORATION_C = 1.414;
    let bestSteps = null;

    function getTopCard(col) {
        if (col.length === 0) return null;
        return col[col.length - 1];
    }

    function getMoves() {
        const moves = [];
        const hasEmptySlot = state.slots.some(s => s === null);

        // Tableau top cards → slot
        for (let ci = 0; ci < state.tableau.length; ci++) {
            const top = getTopCard(state.tableau[ci]);
            if (!top || !top.faceUp) continue;

            if (top.card.type === 'regular') {
                const slotIdx = state.slots.findIndex(
                    s => s !== null && s.key === top.card.category && s.collected < s.target
                );
                if (slotIdx !== -1) {
                    moves.push({ type: 'tableau_to_slot', colIdx: ci, slotIdx });
                }
            }
            if (top.card.type === 'gold' && hasEmptySlot) {
                moves.push({ type: 'tableau_gold_to_slot', colIdx: ci });
            }
        }

        // Hand display → slot
        if (state.handDisplay.length > 0) {
            const topCard = state.handDisplay[state.handDisplay.length - 1];
            if (topCard.type === 'regular') {
                const slotIdx = state.slots.findIndex(
                    s => s !== null && s.key === topCard.category && s.collected < s.target
                );
                if (slotIdx !== -1) {
                    moves.push({ type: 'display_to_slot', slotIdx });
                }
            }
            if (topCard.type === 'gold' && hasEmptySlot) {
                moves.push({ type: 'display_gold_to_slot' });
            }
        }

        // Tableau → column
        for (let ci = 0; ci < state.tableau.length; ci++) {
            const col = state.tableau[ci];
            const top = getTopCard(col);
            if (!top || !top.faceUp) continue;
            for (let ti = 0; ti < state.tableau.length; ti++) {
                if (ti === ci) continue;
                if (canStackOnColumn(top.card, state.tableau[ti])) {
                    moves.push({ type: 'tableau_to_column', srcCol: ci, dstCol: ti });
                }
            }
        }

        // Hand display → column
        if (state.handDisplay.length > 0) {
            const topCard = state.handDisplay[state.handDisplay.length - 1];
            for (let ti = 0; ti < state.tableau.length; ti++) {
                if (canStackOnColumn(topCard, state.tableau[ti])) {
                    moves.push({ type: 'display_to_column', dstCol: ti });
                }
            }
        }

        // Flip hand
        if (state.handPile.length > 0) {
            moves.push({ type: 'flip_hand' });
        }

        // Recycle (costs 1 step)
        if (state.handPile.length === 0 && state.handDisplay.length > 0 && state.recycleCount < MAX_RECYCLES) {
            moves.push({ type: 'recycle' });
        }

        return moves;
    }

    function autoFlip(col) {
        if (col.length > 0 && !col[col.length - 1].faceUp) {
            col[col.length - 1].faceUp = true;
            return true;
        }
        return false;
    }

    function applyMove(move) {
        const undo = { type: move.type };

        if (move.type === 'tableau_to_slot') {
            state.stepsLeft--;
            const col = state.tableau[move.colIdx];
            const tc = col.pop();
            undo.colIdx = move.colIdx;
            undo.tc = tc;
            undo.slotIdx = move.slotIdx;

            const slot = state.slots[move.slotIdx];
            undo.prevCollected = slot.collected;
            slot.collected++;
            if (slot.collected >= slot.target) {
                undo.completed = { ...slot };
                state.slots[move.slotIdx] = null;
                state.completedCount++;
            }
            undo.flipped = autoFlip(col);

        } else if (move.type === 'tableau_gold_to_slot') {
            state.stepsLeft--;
            const col = state.tableau[move.colIdx];
            const tc = col.pop();
            undo.colIdx = move.colIdx;
            undo.tc = tc;

            const emptyIdx = state.slots.findIndex(s => s === null);
            state.slots[emptyIdx] = {
                key: tc.card.category,
                collected: 0,
                target: categoryTargets[tc.card.category] || 0,
            };
            undo.slotIdx = emptyIdx;
            undo.flipped = autoFlip(col);

        } else if (move.type === 'display_to_slot') {
            state.stepsLeft--;
            const card = state.handDisplay.pop();
            undo.card = card;
            undo.slotIdx = move.slotIdx;

            const slot = state.slots[move.slotIdx];
            undo.prevCollected = slot.collected;
            slot.collected++;
            if (slot.collected >= slot.target) {
                undo.completed = { ...slot };
                state.slots[move.slotIdx] = null;
                state.completedCount++;
            }

        } else if (move.type === 'display_gold_to_slot') {
            state.stepsLeft--;
            const card = state.handDisplay.pop();
            undo.card = card;
            const emptyIdx = state.slots.findIndex(s => s === null);
            state.slots[emptyIdx] = {
                key: card.category,
                collected: 0,
                target: categoryTargets[card.category] || 0,
            };
            undo.slotIdx = emptyIdx;

        } else if (move.type === 'tableau_to_column') {
            state.stepsLeft--;
            const srcCol = state.tableau[move.srcCol];
            const tc = srcCol.pop();
            undo.srcCol = move.srcCol;
            undo.dstCol = move.dstCol;
            undo.tc = tc;
            state.tableau[move.dstCol].push(tc);
            undo.flipped = autoFlip(srcCol);

        } else if (move.type === 'display_to_column') {
            state.stepsLeft--;
            const card = state.handDisplay.pop();
            undo.card = card;
            undo.dstCol = move.dstCol;
            state.tableau[move.dstCol].push({ card, faceUp: true });

        } else if (move.type === 'flip_hand') {
            state.stepsLeft--;
            const card = state.handPile.pop();
            state.handDisplay.push(card);
            undo.card = card;

        } else if (move.type === 'recycle') {
            state.stepsLeft--;
            undo.displaySnapshot = [...state.handDisplay];
            state.handPile = [...state.handDisplay].reverse();
            state.handDisplay = [];
            state.recycleCount++;
        }

        return undo;
    }

    function undoMove(undo) {
        if (undo.type === 'tableau_to_slot') {
            state.stepsLeft++;
            if (undo.flipped) state.tableau[undo.colIdx][state.tableau[undo.colIdx].length - 1].faceUp = false;
            state.tableau[undo.colIdx].push(undo.tc);
            if (undo.completed) {
                state.completedCount--;
                state.slots[undo.slotIdx] = undo.completed;
                state.slots[undo.slotIdx].collected = undo.prevCollected;
            } else {
                state.slots[undo.slotIdx].collected--;
            }

        } else if (undo.type === 'tableau_gold_to_slot') {
            state.stepsLeft++;
            if (undo.flipped) state.tableau[undo.colIdx][state.tableau[undo.colIdx].length - 1].faceUp = false;
            state.tableau[undo.colIdx].push(undo.tc);
            state.slots[undo.slotIdx] = null;

        } else if (undo.type === 'display_to_slot') {
            state.stepsLeft++;
            if (undo.completed) {
                state.completedCount--;
                state.slots[undo.slotIdx] = undo.completed;
                state.slots[undo.slotIdx].collected = undo.prevCollected;
            } else {
                state.slots[undo.slotIdx].collected--;
            }
            state.handDisplay.push(undo.card);

        } else if (undo.type === 'display_gold_to_slot') {
            state.stepsLeft++;
            state.slots[undo.slotIdx] = null;
            state.handDisplay.push(undo.card);

        } else if (undo.type === 'tableau_to_column') {
            state.stepsLeft++;
            state.tableau[undo.dstCol].pop();
            if (undo.flipped) state.tableau[undo.srcCol][state.tableau[undo.srcCol].length - 1].faceUp = false;
            state.tableau[undo.srcCol].push(undo.tc);

        } else if (undo.type === 'display_to_column') {
            state.stepsLeft++;
            state.tableau[undo.dstCol].pop();
            state.handDisplay.push(undo.card);

        } else if (undo.type === 'flip_hand') {
            state.stepsLeft++;
            state.handDisplay.pop();
            state.handPile.push(undo.card);

        } else if (undo.type === 'recycle') {
            state.stepsLeft++;
            state.handDisplay = undo.displaySnapshot;
            state.handPile = [];
            state.recycleCount--;
        }
    }

    // ── MCTS Implementation ──────────────────────────────────────────

    function createNode(parent, move, depth) {
        return {
            parent,
            move,
            children: [],
            untriedMoves: null,
            visits: 0,
            wins: 0,
            totalSteps: 0,
            depth,
        };
    }

    function ucb1(node, parentVisits) {
        if (node.visits === 0) return Infinity;
        const exploit = node.wins / node.visits;
        const explore = EXPLORATION_C * Math.sqrt(Math.log(parentVisits) / node.visits);
        return exploit + explore;
    }

    function bestChild(node) {
        const pv = node.visits;
        let best = null;
        let bestVal = -1;
        for (const c of node.children) {
            const v = ucb1(c, pv);
            if (v > bestVal) {
                bestVal = v;
                best = c;
            }
        }
        return best;
    }

    function initUntriedMoves(node) {
        if (node.untriedMoves === null) {
            node.untriedMoves = getMoves();
            shuffleArray(node.untriedMoves);
        }
    }

    function getMoveWeight(move) {
        const mt = move.type;
        if (mt === 'tableau_to_slot' || mt === 'tableau_gold_to_slot' || mt === 'display_to_slot' || mt === 'display_gold_to_slot') {
            return 100;
        }
        if (mt === 'tableau_to_column') return 50;
        if (mt === 'display_to_column') return 20;
        if (mt === 'flip_hand') return 20;
        return 10; // recycle
    }

    function greedyRolloutChoice(moves) {
        let bestWeight = -1;
        let candidates = [];
        for (const m of moves) {
            const w = getMoveWeight(m);
            if (w > bestWeight) {
                bestWeight = w;
                candidates = [m];
            } else if (w === bestWeight) {
                candidates.push(m);
            }
        }
        if (candidates.length === 1) return candidates[0];
        return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function rollout() {
        const rolloutUndos = [];
        let won = false;
        while (state.stepsLeft > 0) {
            if (state.completedCount >= state.numCategories) {
                won = true;
                break;
            }
            const moves = getMoves();
            if (moves.length === 0) break;
            const move = greedyRolloutChoice(moves);
            rolloutUndos.push(applyMove(move));
            nodesExplored++;
        }
        const stepsUsed = maxSteps - state.stepsLeft;
        for (let i = rolloutUndos.length - 1; i >= 0; i--) {
            undoMove(rolloutUndos[i]);
        }
        return { won, stepsUsed };
    }

    function mctsIterate(root) {
        // SELECT
        let node = root;
        const pathUndos = [];
        while (node.untriedMoves !== null && node.untriedMoves.length === 0 && node.children.length > 0) {
            node = bestChild(node);
            pathUndos.push(applyMove(node.move));
            nodesExplored++;
        }

        // Check if already won
        if (state.completedCount >= state.numCategories) {
            const stepsUsed = maxSteps - state.stepsLeft;
            if (bestSteps === null || stepsUsed < bestSteps) bestSteps = stepsUsed;
            let n = node;
            while (n !== null) {
                n.visits++;
                n.wins++;
                n.totalSteps += stepsUsed;
                n = n.parent;
            }
            for (let i = pathUndos.length - 1; i >= 0; i--) undoMove(pathUndos[i]);
            return;
        }

        // EXPAND
        initUntriedMoves(node);
        if (node.untriedMoves.length > 0) {
            const move = node.untriedMoves.pop();
            const child = createNode(node, move, node.depth + 1);
            node.children.push(child);
            pathUndos.push(applyMove(move));
            nodesExplored++;
            node = child;
        }

        // SIMULATE
        const { won, stepsUsed } = rollout();
        if (won && (bestSteps === null || stepsUsed < bestSteps)) {
            bestSteps = stepsUsed;
        }

        // BACKPROPAGATE
        let n = node;
        while (n !== null) {
            n.visits++;
            if (won) {
                n.wins++;
                n.totalSteps += stepsUsed;
            }
            n = n.parent;
        }

        // Undo path
        for (let i = pathUndos.length - 1; i >= 0; i--) {
            undoMove(pathUndos[i]);
        }
    }

    const root = createNode(null, null, 0);
    initUntriedMoves(root);

    for (let iter = 0; iter < mctsIterations; iter++) {
        mctsIterate(root);
        if (nodesExplored > MAX_NODES) break;
    }

    const solvable = bestSteps !== null;
    return {
        solvable,
        nodesExplored,
        stepsUsed: solvable ? bestSteps : 0,
    };
}

// ─── Layout Quality Validation ────────────────────────────────────

function tryGreedyDrag(simTableau, simDisplay, simSlots, categoryTargets) {
    // Priority 1: face-up tableau card → matching slot (collect)
    for (let ci = 0; ci < simTableau.length; ci++) {
        const col = simTableau[ci];
        if (!col.length || !col[col.length - 1].faceUp) continue;
        const card = col[col.length - 1].card;
        if (card.type === 'regular') {
            for (let si = 0; si < simSlots.length; si++) {
                const s = simSlots[si];
                if (s !== null && s.key === card.category && s.collected < s.target) {
                    col.pop();
                    s.collected++;
                    if (s.collected >= s.target) simSlots[si] = null;
                    if (col.length && !col[col.length - 1].faceUp) col[col.length - 1].faceUp = true;
                    return true;
                }
            }
        }
    }

    // Priority 1b: face-up tableau gold → empty slot
    for (let ci = 0; ci < simTableau.length; ci++) {
        const col = simTableau[ci];
        if (!col.length || !col[col.length - 1].faceUp) continue;
        const card = col[col.length - 1].card;
        if (card.type === 'gold') {
            for (let si = 0; si < simSlots.length; si++) {
                if (simSlots[si] === null) {
                    col.pop();
                    simSlots[si] = {
                        key: card.category,
                        collected: 0,
                        target: categoryTargets[card.category] || 0,
                    };
                    if (col.length && !col[col.length - 1].faceUp) col[col.length - 1].faceUp = true;
                    return true;
                }
            }
        }
    }

    // Priority 1c: hand display top → matching slot
    if (simDisplay.length > 0) {
        const top = simDisplay[simDisplay.length - 1];
        if (top.type === 'regular') {
            for (let si = 0; si < simSlots.length; si++) {
                const s = simSlots[si];
                if (s !== null && s.key === top.category && s.collected < s.target) {
                    simDisplay.pop();
                    s.collected++;
                    if (s.collected >= s.target) simSlots[si] = null;
                    return true;
                }
            }
        }
        if (top.type === 'gold') {
            for (let si = 0; si < simSlots.length; si++) {
                if (simSlots[si] === null) {
                    simDisplay.pop();
                    simSlots[si] = {
                        key: top.category,
                        collected: 0,
                        target: categoryTargets[top.category] || 0,
                    };
                    return true;
                }
            }
        }
    }

    // Priority 2: tableau → same-category column (stack)
    for (let ci = 0; ci < simTableau.length; ci++) {
        const col = simTableau[ci];
        if (!col.length || !col[col.length - 1].faceUp) continue;
        const card = col[col.length - 1].card;
        if (card.type === 'gold') continue;
        for (let ti = 0; ti < simTableau.length; ti++) {
            if (ti === ci || !simTableau[ti].length) continue;
            const topTc = simTableau[ti][simTableau[ti].length - 1];
            if (topTc.card.type === 'gold') continue;
            if (card.category === topTc.card.category) {
                const tc = col.pop();
                simTableau[ti].push(tc);
                if (col.length && !col[col.length - 1].faceUp) col[col.length - 1].faceUp = true;
                return true;
            }
        }
    }

    // Priority 3: hand display → column (stack)
    if (simDisplay.length > 0) {
        const top = simDisplay[simDisplay.length - 1];
        for (let ti = 0; ti < simTableau.length; ti++) {
            if (!simTableau[ti].length) {
                simDisplay.pop();
                simTableau[ti].push({ card: top, faceUp: true });
                return true;
            }
            const topTc = simTableau[ti][simTableau[ti].length - 1];
            if (topTc.card.type === 'gold') continue;
            if (top.category === topTc.card.category) {
                simDisplay.pop();
                simTableau[ti].push({ card: top, faceUp: true });
                return true;
            }
        }
    }

    return false;
}

function validateLayout(tableau, handPile, categoryTargets, maxSlots) {
    // ── 条件 3：金牌可及性 ──
    let goldAccessible = false;
    for (const col of tableau) {
        if (col.length && col[col.length - 1].faceUp && col[col.length - 1].card.type === 'gold') {
            goldAccessible = true;
            break;
        }
    }
    if (!goldAccessible) {
        for (let i = 0; i < Math.min(5, handPile.length); i++) {
            if (handPile[i].type === 'gold') {
                goldAccessible = true;
                break;
            }
        }
    }
    if (!goldAccessible) return false;

    // ── 条件 1：开局可操作 ──
    const faceUpCards = []; // [{colIdx, card}]
    for (let ci = 0; ci < tableau.length; ci++) {
        const col = tableau[ci];
        if (col.length && col[col.length - 1].faceUp) {
            faceUpCards.push({ colIdx: ci, card: col[col.length - 1].card });
        }
    }

    let hasImmediateMove = false;

    for (let i = 0; i < faceUpCards.length; i++) {
        const { card: cardI } = faceUpCards[i];
        if (cardI.type === 'gold') {
            hasImmediateMove = true;
            break;
        }
        for (let j = 0; j < faceUpCards.length; j++) {
            if (i !== j && cardI.category === faceUpCards[j].card.category) {
                hasImmediateMove = true;
                break;
            }
        }
        if (hasImmediateMove) break;
    }

    if (!hasImmediateMove) {
        for (let k = 0; k < Math.min(2, handPile.length); k++) {
            const card = handPile[k];
            if (card.type === 'gold') {
                hasImmediateMove = true;
                break;
            }
            for (const fu of faceUpCards) {
                if (card.category === fu.card.category) {
                    hasImmediateMove = true;
                    break;
                }
            }
            if (hasImmediateMove) break;
        }
    }

    if (!hasImmediateMove) return false;

    // ── 条件 2：前期流畅性（贪心模拟）──
    const simTableau = tableau.map(col => col.map(tc => ({ card: { ...tc.card }, faceUp: tc.faceUp })));
    const simHand = handPile.map(c => ({ ...c }));
    const simDisplay = [];
    const simSlots = new Array(maxSlots).fill(null);

    let dragCount = 0;
    let consecFlips = 0;

    for (let step = 0; step < 20; step++) {
        if (dragCount >= 5) break;

        const didDrag = tryGreedyDrag(simTableau, simDisplay, simSlots, categoryTargets);

        if (didDrag) {
            dragCount++;
            consecFlips = 0;
        } else {
            if (simHand.length > 0) {
                simDisplay.push(simHand.shift());
                consecFlips++;
                if (consecFlips > 3) return false;
            } else {
                break;
            }
        }
    }

    return true;
}

// ─── Generator Logic ───────────────────────────────────────────────

// ─── Greedy Solver ────────────────────────────────────────────────

function greedySolve(tableau, categoryTargets, maxSteps, maxSlots, handPile) {
    const MAX_RECYCLES_GS = 3;

    // Deep clone state
    const st = {
        tableau: tableau.map(col => col.map(tc => ({ card: { ...tc.card }, faceUp: tc.faceUp }))),
        slots: new Array(maxSlots).fill(null),
        stepsLeft: maxSteps,
        completedCount: 0,
        numCategories: Object.keys(categoryTargets).length,
        handPile: [...handPile].map(c => ({ ...c })),
        handDisplay: [],
        recycleCount: 0,
    };

    function getTop(col) { return col.length > 0 ? col[col.length - 1] : null; }

    function autoFlipCol(col) {
        if (col.length > 0 && !col[col.length - 1].faceUp) {
            col[col.length - 1].faceUp = true;
        }
    }

    function canStack(card, col) {
        if (col.length === 0) return true;
        const top = col[col.length - 1];
        if (top.card.type === 'gold') return false;
        return card.category === top.card.category;
    }

    function gsGetMoves() {
        const moves = [];
        const hasEmptySlot = st.slots.some(s => s === null);

        for (let ci = 0; ci < st.tableau.length; ci++) {
            const top = getTop(st.tableau[ci]);
            if (!top || !top.faceUp) continue;
            if (top.card.type === 'regular') {
                const si = st.slots.findIndex(s => s !== null && s.key === top.card.category && s.collected < s.target);
                if (si !== -1) moves.push({ type: 'tableau_to_slot', colIdx: ci, slotIdx: si });
            }
            if (top.card.type === 'gold' && hasEmptySlot) {
                moves.push({ type: 'tableau_gold_to_slot', colIdx: ci });
            }
        }

        if (st.handDisplay.length > 0) {
            const topCard = st.handDisplay[st.handDisplay.length - 1];
            if (topCard.type === 'regular') {
                const si = st.slots.findIndex(s => s !== null && s.key === topCard.category && s.collected < s.target);
                if (si !== -1) moves.push({ type: 'display_to_slot', slotIdx: si });
            }
            if (topCard.type === 'gold' && hasEmptySlot) {
                moves.push({ type: 'display_gold_to_slot' });
            }
        }

        for (let ci = 0; ci < st.tableau.length; ci++) {
            const col = st.tableau[ci];
            const top = getTop(col);
            if (!top || !top.faceUp) continue;
            // Only allow column moves that uncover a face-down card
            const hasHidden = col.length >= 2 && !col[col.length - 2].faceUp;
            if (!hasHidden) continue;
            for (let ti = 0; ti < st.tableau.length; ti++) {
                if (ti === ci) continue;
                if (canStack(top.card, st.tableau[ti])) {
                    moves.push({ type: 'tableau_to_column', srcCol: ci, dstCol: ti });
                }
            }
        }

        if (st.handDisplay.length > 0) {
            const topCard = st.handDisplay[st.handDisplay.length - 1];
            for (let ti = 0; ti < st.tableau.length; ti++) {
                if (canStack(topCard, st.tableau[ti])) {
                    moves.push({ type: 'display_to_column', dstCol: ti });
                }
            }
        }

        if (st.handPile.length > 0) {
            moves.push({ type: 'flip_hand' });
        }

        if (st.handPile.length === 0 && st.handDisplay.length > 0 && st.recycleCount < MAX_RECYCLES_GS) {
            moves.push({ type: 'recycle' });
        }

        return moves;
    }

    function gsMoveWeight(move) {
        const mt = move.type;
        if (mt === 'tableau_to_slot' || mt === 'tableau_gold_to_slot' || mt === 'display_to_slot' || mt === 'display_gold_to_slot') return 100;
        if (mt === 'tableau_to_column') return 50;
        if (mt === 'display_to_column') return 20;
        if (mt === 'flip_hand') return 20;
        return 10;
    }

    function gsGreedyChoice(moves) {
        let bestWeight = -1;
        let candidates = [];
        for (const m of moves) {
            const w = gsMoveWeight(m);
            if (w > bestWeight) { bestWeight = w; candidates = [m]; }
            else if (w === bestWeight) { candidates.push(m); }
        }
        return candidates.length === 1 ? candidates[0] : candidates[Math.floor(Math.random() * candidates.length)];
    }

    function gsApplyMove(move) {
        if (move.type === 'tableau_to_slot') {
            st.stepsLeft--;
            const col = st.tableau[move.colIdx];
            col.pop();
            const slot = st.slots[move.slotIdx];
            slot.collected++;
            if (slot.collected >= slot.target) { st.slots[move.slotIdx] = null; st.completedCount++; }
            autoFlipCol(col);
        } else if (move.type === 'tableau_gold_to_slot') {
            st.stepsLeft--;
            const col = st.tableau[move.colIdx];
            const tc = col.pop();
            const ei = st.slots.findIndex(s => s === null);
            st.slots[ei] = { key: tc.card.category, collected: 0, target: categoryTargets[tc.card.category] || 0 };
            autoFlipCol(col);
        } else if (move.type === 'display_to_slot') {
            st.stepsLeft--;
            st.handDisplay.pop();
            const slot = st.slots[move.slotIdx];
            slot.collected++;
            if (slot.collected >= slot.target) { st.slots[move.slotIdx] = null; st.completedCount++; }
        } else if (move.type === 'display_gold_to_slot') {
            st.stepsLeft--;
            const card = st.handDisplay.pop();
            const ei = st.slots.findIndex(s => s === null);
            st.slots[ei] = { key: card.category, collected: 0, target: categoryTargets[card.category] || 0 };
        } else if (move.type === 'tableau_to_column') {
            st.stepsLeft--;
            const tc = st.tableau[move.srcCol].pop();
            st.tableau[move.dstCol].push(tc);
            autoFlipCol(st.tableau[move.srcCol]);
        } else if (move.type === 'display_to_column') {
            st.stepsLeft--;
            const card = st.handDisplay.pop();
            st.tableau[move.dstCol].push({ card, faceUp: true });
        } else if (move.type === 'flip_hand') {
            st.stepsLeft--;
            st.handDisplay.push(st.handPile.pop());
        } else if (move.type === 'recycle') {
            st.stepsLeft--;
            st.handPile = [...st.handDisplay].reverse();
            st.handDisplay = [];
            st.recycleCount++;
        }
    }

    // Main greedy loop
    while (st.stepsLeft > 0) {
        if (st.completedCount >= st.numCategories) {
            return { won: true, stepsUsed: maxSteps - st.stepsLeft, recyclesUsed: st.recycleCount };
        }
        const moves = gsGetMoves();
        if (moves.length === 0) break;
        gsApplyMove(gsGreedyChoice(moves));
    }
    if (st.completedCount >= st.numCategories) {
        return { won: true, stepsUsed: maxSteps - st.stepsLeft, recyclesUsed: st.recycleCount };
    }
    return { won: false, stepsUsed: -1, recyclesUsed: st.recycleCount };
}

// ─── Layout Generation ────────────────────────────────────────────

function generateSolvableLayout(level) {
    const config = getLevelSettings(level);
    const catDefs = LEVEL_CARD_DEFS[level];
    if (!catDefs) {
        throw new Error('No card definitions found for level ' + level);
    }

    // Use maxSteps from level_settings.js (configured in Excel)
    const maxSteps = config.maxSteps;

    const stepMinRatio = parseFloat(document.getElementById('step-min-ratio').value) || 0.0;
    const stepMaxRatio = parseFloat(document.getElementById('step-max-ratio').value) || 1.0;
    const mctsIter = parseInt(document.getElementById('mcts-iterations').value) || 5000;
    const difficulty = document.getElementById('difficulty').value;

    const maxAttempts = 200;
    let totalNodes = 0;
    let greedySkips = 0;

    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const gen = generateCards(level);

        // 布局质量检查
        if (!validateLayout(gen.tableau, gen.handPile, gen.categoryTargets, config.maxSlots)) {
            continue;
        }

        // 贪心求解（快速，<5ms）
        const greedy = greedySolve(gen.tableau, gen.categoryTargets, maxSteps, config.maxSlots, gen.handPile);

        // 难度过滤（在 MCTS 之前）
        if (difficulty === 'easy' && !greedy.won) { greedySkips++; continue; }
        if (difficulty === 'hard' && greedy.won) { greedySkips++; continue; }

        const result = verifySolvable(
            gen.tableau, gen.categoryTargets,
            maxSteps, config.maxSlots, gen.handPile, mctsIter
        );
        totalNodes += result.nodesExplored;
        if (result.solvable) {
            const stepsUsed = result.stepsUsed;
            const minSteps = Math.floor(maxSteps * stepMinRatio);
            const maxStepsLimit = Math.floor(maxSteps * stepMaxRatio);
            if (stepsUsed < minSteps || stepsUsed > maxStepsLimit) {
                continue;
            }
            return {
                layout: {
                    config: {
                        maxSlots: config.maxSlots,
                        maxSteps: maxSteps,
                        greedySolvable: greedy.won,
                        greedySteps: greedy.won ? greedy.stepsUsed : -1,
                        mctsSteps: stepsUsed,
                    },
                    tableau: gen.tableau.map(col => col.map(tc => ({
                        card: { ...tc.card },
                        faceUp: tc.faceUp,
                    }))),
                    categoryTargets: { ...gen.categoryTargets },
                    handPile: gen.handPile.map(c => ({ ...c })),
                    handDisplay: [],
                },
                attempts: attempt + 1,
                totalNodes,
                stepsUsed,
                maxSteps,
                greedyWon: greedy.won,
                greedySteps: greedy.won ? greedy.stepsUsed : -1,
                greedySkips,
            };
        }
    }
    return { layout: null, attempts: maxAttempts, totalNodes, greedySkips };
}

function downloadJSON(filename, data) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// ─── UI ────────────────────────────────────────────────────────────

const btnGenerate = document.getElementById('btn-generate');
const progressFill = document.getElementById('progress-fill');
const progressLabel = document.getElementById('progress-label');
const logEl = document.getElementById('log');

function log(msg) {
    logEl.textContent += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
}

function setProgress(pct, label) {
    progressFill.style.width = pct + '%';
    progressLabel.textContent = label;
}

btnGenerate.addEventListener('click', async () => {
    const startLevel = parseInt(document.getElementById('start-level').value, 10) || 1;
    const numLevels = parseInt(document.getElementById('num-levels').value, 10) || 2;
    const layoutsPerLevel = parseInt(document.getElementById('layouts-per-level').value, 10) || 5;

    btnGenerate.disabled = true;
    logEl.textContent = '';
    log(`Starting generation: levels ${startLevel}-${startLevel + numLevels - 1}, ${layoutsPerLevel} layouts each`);

    const totalWork = numLevels * layoutsPerLevel;
    let completed = 0;

    for (let lv = startLevel; lv < startLevel + numLevels; lv++) {
        const layouts = [];
        const cfg = getLevelSettings(lv);
        const catDefs = LEVEL_CARD_DEFS[lv];
        if (!catDefs) {
            log(`\n--- Level ${lv}: NO CARD DEFINITIONS FOUND, skipping ---`);
            completed += layoutsPerLevel;
            continue;
        }
        const catNames = catDefs.map(d => d.categoryName).join(', ');
        log(`\n--- Level ${lv} (${cfg.numColumns} cols, ${cfg.totalColumnCards} tableau cards, ${cfg.maxSlots} slots, ${catDefs.length} cats: ${catNames}) ---`);

        for (let i = 0; i < layoutsPerLevel; i++) {
            setProgress((completed / totalWork) * 100, `Level ${lv}: layout ${i + 1}/${layoutsPerLevel}`);

            await new Promise(r => setTimeout(r, 0));

            try {
                const result = generateSolvableLayout(lv);
                if (result.layout) {
                    layouts.push(result.layout);
                    const totalCards = result.layout.tableau.reduce((s, c) => s + c.length, 0);
                    const greedyTag = result.greedyWon ? `YES, ${result.greedySteps}/${result.maxSteps}` : 'NO';
                    log(`  Layout ${i + 1}: OK (${totalCards} tableau + ${result.layout.handPile.length} hand, greedy=${greedyTag}, mcts=${result.stepsUsed}/${result.maxSteps} steps, ${result.attempts} attempts, ${result.totalNodes.toLocaleString()} nodes)`);
                } else {
                    log(`  Layout ${i + 1}: FAILED after ${result.attempts} attempts (${result.totalNodes.toLocaleString()} nodes, ${result.greedySkips || 0} greedy-filtered)`);
                }
            } catch (e) {
                log(`  Layout ${i + 1}: ERROR - ${e.message}`);
                console.error(e);
            }
            completed++;
        }

        if (layouts.length > 0) {
            downloadJSON(`level_${lv}.json`, layouts);
            log(`  Downloaded level_${lv}.json (${layouts.length} layouts)`);
        } else {
            log(`  WARNING: No solvable layouts found for level ${lv}`);
        }
    }

    setProgress(100, 'Done!');
    log('\nGeneration complete!');
    btnGenerate.disabled = false;
});
