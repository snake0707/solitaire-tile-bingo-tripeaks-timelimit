<body>

<script src="level_card_defs.js"></script>
<script src="level_settings.js"></script>
<script>
// ─── Generation Logic ──────────────────────────────────────────────

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function generateCards(level) {
    const config = getLevelSettings(level);
    const catDefs = LEVEL_CARD_DEFS[level];
    if (!catDefs) {
        throw new Error('No card definitions found for level ' + level);
    }

    const goldCards = [];
    const regularCards = [];
    const categoryTargets = {};

    for (const def of catDefs) {
        const catKey = def.isImage ? def.categoryName : def.categoryName + '_word';

        // Gold card
        goldCards.push({
            type: 'gold',
            category: catKey,
            name: def.categoryName,
            isText: !def.isImage,
        });

        // Regular cards
        categoryTargets[catKey] = def.cardWords.length;
        for (const word of def.cardWords) {
            if (def.isImage) {
                regularCards.push({
                    type: 'regular',
                    category: catKey,
                    name: word.name,
                    image: word.image,
                    isText: false,
                });
            } else {
                const wordName = typeof word === 'string' ? word : word.name;
                regularCards.push({
                    type: 'regular',
                    category: catKey,
                    name: wordName,
                    isText: true,
                });
            }
        }
    }

    const allCards = [...regularCards, ...goldCards];
    // Shuffle 10 rounds for better randomization
    for (let i = 0; i < 10; i++) shuffleArray(allCards);

    const totalColumnCards = config.totalColumnCards;
    const tableauCards = allCards.slice(0, totalColumnCards);
    const handCards = allCards.slice(totalColumnCards);

    // Build tableau columns
    const tableau = [];
    let cardIdx = 0;
    for (let ci = 0; ci < config.numColumns; ci++) {
        const colSize = config.columnSizes[ci];
        const col = [];
        for (let pos = 0; pos < colSize; pos++) {
            if (cardIdx >= tableauCards.length) break;
            const card = tableauCards[cardIdx++];
            const isFaceUp = (pos === colSize - 1);
            col.push({ card, faceUp: isFaceUp });
        }
        tableau.push(col);
    }

    return { tableau, categoryTargets, handPile: handCards };
}

// ─── Heuristic Solver (SAJLike solitaire rules) ──────────────────────────

function canStackOnColumn(card, col) {
    if (col.length === 0) return true;
    const topCard = col[col.length - 1];
    if (topCard.card.type === 'gold') return false; // sealed
    return card.category === topCard.card.category;
}

// ─── MCTS Solver — preserved for future use, currently not called ─────────
// Replaced by solveLevel() which uses Priority + Equality backtracking.

function verifySolvable(tableau, categoryTargets, maxSteps, maxSlots, handPile, mctsIterations) {
    if (mctsIterations === undefined) mctsIterations = 5000;

    // Deep clone state
    const state = {
        tableau: tableau.map(col => col.map(tc => ({ card: { ...tc.card }, faceUp: tc.faceUp }))),
        slots: new Array(maxSlots).fill(null),
        stepsLeft: maxSteps,
        completedCount: 0,
        numCategories: Object.keys(categoryTargets).length,
        handPile: [...handPile].map(c => ({ ...c })),
        handDisplay: [],
        recycleCount: 0,
    };

    let nodesExplored = 0;
    const MAX_NODES = 2000000;
    const MAX_RECYCLES = 3;
    const EXPLORATION_C = 1.414;
    let bestSteps = null;
    let bestMoveTypes = null;

    function getTopCard(col) {
        if (col.length === 0) return null;
        return col[col.length - 1];
    }

    function getMoves() {
        const moves = [];
        const hasEmptySlot = state.slots.some(s => s === null);

        // Tableau top cards → slot (single and multi-card)
        for (let ci = 0; ci < state.tableau.length; ci++) {
            const col = state.tableau[ci];
            const top = getTopCard(col);
            if (!top || !top.faceUp) continue;

            // Check multi-card drag
            const topIdx = col.length - 1;
            const cat = col[topIdx].card.category;
            let startIdx = topIdx;
            while (startIdx > 0 && col[startIdx - 1].faceUp && col[startIdx - 1].card.category === cat) {
                startIdx--;
            }
            const dragCount = topIdx - startIdx + 1;

            if (dragCount >= 2) {
                // Case A: gold on top + regulars below
                if (col[topIdx].card.type === 'gold' && hasEmptySlot) {
                    let allRegular = true;
                    for (let i = startIdx; i < topIdx; i++) {
                        if (col[i].card.type !== 'regular') { allRegular = false; break; }
                    }
                    if (allRegular) {
                        moves.push({ type: 'tableau_multi_to_slot', colIdx: ci, startIdx, count: dragCount });
                    }
                }
                // Case B: all regular → match existing slot
                if (!moves.some(m => m.type === 'tableau_multi_to_slot' && m.colIdx === ci)) {
                    let allRegular = true;
                    for (let i = startIdx; i <= topIdx; i++) {
                        if (col[i].card.type !== 'regular') { allRegular = false; break; }
                    }
                    if (allRegular) {
                        const si = state.slots.findIndex(s => s !== null && s.key === cat && s.collected + dragCount <= s.target);
                        if (si !== -1) {
                            moves.push({ type: 'tableau_multi_to_slot', colIdx: ci, startIdx, count: dragCount });
                        }
                    }
                }
            }

            // Single card moves (skip if multi-to-slot already covers this column)
            const addedMulti = moves.some(m => m.type === 'tableau_multi_to_slot' && m.colIdx === ci);
            if (top.card.type === 'regular' && !addedMulti) {
                const slotIdx = state.slots.findIndex(
                    s => s !== null && s.key === top.card.category && s.collected < s.target
                );
                if (slotIdx !== -1) {
                    moves.push({ type: 'tableau_to_slot', colIdx: ci, slotIdx });
                }
            }
            if (top.card.type === 'gold' && hasEmptySlot && !addedMulti) {
                moves.push({ type: 'tableau_gold_to_slot', colIdx: ci });
            }
        }

        // Hand display → slot
        if (state.handDisplay.length > 0) {
            const topCard = state.handDisplay[state.handDisplay.length - 1];
            if (topCard.type === 'regular') {
                const slotIdx = state.slots.findIndex(
                    s => s !== null && s.key === topCard.category && s.collected < s.target
                );
                if (slotIdx !== -1) {
                    moves.push({ type: 'display_to_slot', slotIdx });
                }
            }
            if (topCard.type === 'gold' && hasEmptySlot) {
                moves.push({ type: 'display_gold_to_slot' });
            }
        }

        // Tableau → column (single card)
        for (let ci = 0; ci < state.tableau.length; ci++) {
            const col = state.tableau[ci];
            const top = getTopCard(col);
            if (!top || !top.faceUp) continue;
            for (let ti = 0; ti < state.tableau.length; ti++) {
                if (ti === ci) continue;
                if (canStackOnColumn(top.card, state.tableau[ti])) {
                    moves.push({ type: 'tableau_to_column', srcCol: ci, dstCol: ti });
                }
            }
        }

        // Tableau → column (multi-card: consecutive same-category face-up cards ≥2)
        for (let ci = 0; ci < state.tableau.length; ci++) {
            const col = state.tableau[ci];
            if (!col.length) continue;
            const topIdx = col.length - 1;
            if (!col[topIdx].faceUp) continue;
            const cat = col[topIdx].card.category;
            let startIdx = topIdx;
            while (startIdx > 0 && col[startIdx - 1].faceUp && col[startIdx - 1].card.category === cat) {
                startIdx--;
            }
            const dragCount = topIdx - startIdx + 1;
            if (dragCount < 2) continue;
            const bottomCard = col[startIdx].card;
            for (let ti = 0; ti < state.tableau.length; ti++) {
                if (ti === ci) continue;
                if (canStackOnColumn(bottomCard, state.tableau[ti])) {
                    moves.push({ type: 'tableau_multi_to_column', srcCol: ci, dstCol: ti, startIdx, count: dragCount });
                }
            }
        }

        // Hand display → column
        if (state.handDisplay.length > 0) {
            const topCard = state.handDisplay[state.handDisplay.length - 1];
            for (let ti = 0; ti < state.tableau.length; ti++) {
                if (canStackOnColumn(topCard, state.tableau[ti])) {
                    moves.push({ type: 'display_to_column', dstCol: ti });
                }
            }
        }

        // Flip hand
        if (state.handPile.length > 0) {
            moves.push({ type: 'flip_hand' });
        }

        // Recycle (costs 1 step)
        if (state.handPile.length === 0 && state.handDisplay.length > 0 && state.recycleCount < MAX_RECYCLES) {
            moves.push({ type: 'recycle' });
        }

        return moves;
    }

    function autoFlip(col) {
        if (col.length > 0 && !col[col.length - 1].faceUp) {
            col[col.length - 1].faceUp = true;
            return true;
        }
        return false;
    }

    function applyMove(move) {
        const undo = { type: move.type };

        if (move.type === 'tableau_multi_to_slot') {
            state.stepsLeft--;
            const col = state.tableau[move.colIdx];
            const removed = col.splice(move.startIdx);
            undo.colIdx = move.colIdx;
            undo.removed = removed;
            undo.startIdx = move.startIdx;

            const topCard = removed[removed.length - 1];
            const bottomCard = removed[0];
            const goldCard = topCard.card.type === 'gold' ? topCard : (bottomCard.card.type === 'gold' ? bottomCard : null);
            if (goldCard) {
                const emptyIdx = state.slots.findIndex(s => s === null);
                const regularCount = removed.length - 1;
                const target = categoryTargets[goldCard.card.category] || 0;
                state.slots[emptyIdx] = { key: goldCard.card.category, collected: regularCount, target };
                undo.slotIdx = emptyIdx;
                undo.slotWasNone = true;
                if (regularCount >= target) {
                    undo.completed = { ...state.slots[emptyIdx] };
                    state.slots[emptyIdx] = null;
                    state.completedCount++;
                }
            } else {
                const cat = removed[0].card.category;
                const si = state.slots.findIndex(s => s !== null && s.key === cat);
                if (si !== -1) {
                    undo.slotIdx = si;
                    undo.slotWasNone = false;
                    undo.prevCollected = state.slots[si].collected;
                    state.slots[si].collected += removed.length;
                    if (state.slots[si].collected >= state.slots[si].target) {
                        undo.completed = { ...state.slots[si] };
                        state.slots[si] = null;
                        state.completedCount++;
                    }
                }
            }
            undo.flipped = autoFlip(col);

        } else if (move.type === 'tableau_to_slot') {
            state.stepsLeft--;
            const col = state.tableau[move.colIdx];
            const tc = col.pop();
            undo.colIdx = move.colIdx;
            undo.tc = tc;
            undo.slotIdx = move.slotIdx;

            const slot = state.slots[move.slotIdx];
            undo.prevCollected = slot.collected;
            slot.collected++;
            if (slot.collected >= slot.target) {
                undo.completed = { ...slot };
                state.slots[move.slotIdx] = null;
                state.completedCount++;
            }
            undo.flipped = autoFlip(col);

        } else if (move.type === 'tableau_gold_to_slot') {
            state.stepsLeft--;
            const col = state.tableau[move.colIdx];
            const tc = col.pop();
            undo.colIdx = move.colIdx;
            undo.tc = tc;

            const emptyIdx = state.slots.findIndex(s => s === null);
            state.slots[emptyIdx] = {
                key: tc.card.category,
                collected: 0,
                target: categoryTargets[tc.card.category] || 0,
            };
            undo.slotIdx = emptyIdx;
            undo.flipped = autoFlip(col);

        } else if (move.type === 'display_to_slot') {
            state.stepsLeft--;
            const card = state.handDisplay.pop();
            undo.card = card;
            undo.slotIdx = move.slotIdx;

            const slot = state.slots[move.slotIdx];
            undo.prevCollected = slot.collected;
            slot.collected++;
            if (slot.collected >= slot.target) {
                undo.completed = { ...slot };
                state.slots[move.slotIdx] = null;
                state.completedCount++;
            }

        } else if (move.type === 'display_gold_to_slot') {
            state.stepsLeft--;
            const card = state.handDisplay.pop();
            undo.card = card;
            const emptyIdx = state.slots.findIndex(s => s === null);
            state.slots[emptyIdx] = {
                key: card.category,
                collected: 0,
                target: categoryTargets[card.category] || 0,
            };
            undo.slotIdx = emptyIdx;

        } else if (move.type === 'tableau_to_column') {
            state.stepsLeft--;
            const srcCol = state.tableau[move.srcCol];
            const tc = srcCol.pop();
            undo.srcCol = move.srcCol;
            undo.dstCol = move.dstCol;
            undo.tc = tc;
            state.tableau[move.dstCol].push(tc);
            undo.flipped = autoFlip(srcCol);

        } else if (move.type === 'tableau_multi_to_column') {
            state.stepsLeft--;
            const srcCol = state.tableau[move.srcCol];
            const startIdx = move.startIdx;
            const removed = srcCol.splice(startIdx);
            undo.srcCol = move.srcCol;
            undo.dstCol = move.dstCol;
            undo.removed = removed;
            undo.startIdx = startIdx;
            state.tableau[move.dstCol].push(...removed);
            undo.flipped = autoFlip(srcCol);

        } else if (move.type === 'display_to_column') {
            state.stepsLeft--;
            const card = state.handDisplay.pop();
            undo.card = card;
            undo.dstCol = move.dstCol;
            state.tableau[move.dstCol].push({ card, faceUp: true });

        } else if (move.type === 'flip_hand') {
            state.stepsLeft--;
            const card = state.handPile.pop();
            state.handDisplay.push(card);
            undo.card = card;

        } else if (move.type === 'recycle') {
            state.stepsLeft--;
            undo.displaySnapshot = [...state.handDisplay];
            state.handPile = [...state.handDisplay].reverse();
            state.handDisplay = [];
            state.recycleCount++;
        }

        return undo;
    }

    function undoMove(undo) {
        if (undo.type === 'tableau_multi_to_slot') {
            state.stepsLeft++;
            const col = state.tableau[undo.colIdx];
            if (undo.flipped) col[col.length - 1].faceUp = false;
            col.push(...undo.removed);
            if (undo.completed) state.completedCount--;
            if (undo.slotWasNone) {
                state.slots[undo.slotIdx] = null;
            } else {
                if (state.slots[undo.slotIdx] === null && undo.completed) {
                    state.slots[undo.slotIdx] = undo.completed;
                }
                state.slots[undo.slotIdx].collected = undo.prevCollected;
            }

        } else if (undo.type === 'tableau_to_slot') {
            state.stepsLeft++;
            if (undo.flipped) state.tableau[undo.colIdx][state.tableau[undo.colIdx].length - 1].faceUp = false;
            state.tableau[undo.colIdx].push(undo.tc);
            if (undo.completed) {
                state.completedCount--;
                state.slots[undo.slotIdx] = undo.completed;
                state.slots[undo.slotIdx].collected = undo.prevCollected;
            } else {
                state.slots[undo.slotIdx].collected--;
            }

        } else if (undo.type === 'tableau_gold_to_slot') {
            state.stepsLeft++;
            if (undo.flipped) state.tableau[undo.colIdx][state.tableau[undo.colIdx].length - 1].faceUp = false;
            state.tableau[undo.colIdx].push(undo.tc);
            state.slots[undo.slotIdx] = null;

        } else if (undo.type === 'display_to_slot') {
            state.stepsLeft++;
            if (undo.completed) {
                state.completedCount--;
                state.slots[undo.slotIdx] = undo.completed;
                state.slots[undo.slotIdx].collected = undo.prevCollected;
            } else {
                state.slots[undo.slotIdx].collected--;
            }
            state.handDisplay.push(undo.card);

        } else if (undo.type === 'display_gold_to_slot') {
            state.stepsLeft++;
            state.slots[undo.slotIdx] = null;
            state.handDisplay.push(undo.card);

        } else if (undo.type === 'tableau_to_column') {
            state.stepsLeft++;
            state.tableau[undo.dstCol].pop();
            if (undo.flipped) state.tableau[undo.srcCol][state.tableau[undo.srcCol].length - 1].faceUp = false;
            state.tableau[undo.srcCol].push(undo.tc);

        } else if (undo.type === 'tableau_multi_to_column') {
            state.stepsLeft++;
            const dstCol = state.tableau[undo.dstCol];
            dstCol.splice(dstCol.length - undo.removed.length);
            if (undo.flipped) state.tableau[undo.srcCol][state.tableau[undo.srcCol].length - 1].faceUp = false;
            state.tableau[undo.srcCol].push(...undo.removed);

        } else if (undo.type === 'display_to_column') {
            state.stepsLeft++;
            state.tableau[undo.dstCol].pop();
            state.handDisplay.push(undo.card);

        } else if (undo.type === 'flip_hand') {
            state.stepsLeft++;
            state.handDisplay.pop();
            state.handPile.push(undo.card);

        } else if (undo.type === 'recycle') {
            state.stepsLeft++;
            state.handDisplay = undo.displaySnapshot;
            state.handPile = [];
            state.recycleCount--;
        }
    }

    // ── MCTS Implementation ──────────────────────────────────────────

    function createNode(parent, move, depth) {
        return {
            parent,
            move,
            children: [],
            untriedMoves: null,
            visits: 0,
            wins: 0,
            totalSteps: 0,
            depth,
        };
    }

    function ucb1(node, parentVisits) {
        if (node.visits === 0) return Infinity;
        const exploit = node.wins / node.visits;
        const explore = EXPLORATION_C * Math.sqrt(Math.log(parentVisits) / node.visits);
        return exploit + explore;
    }

    function bestChild(node) {
        const pv = node.visits;
        let best = null;
        let bestVal = -1;
        for (const c of node.children) {
            const v = ucb1(c, pv);
            if (v > bestVal) {
                bestVal = v;
                best = c;
            }
        }
        return best;
    }

    function initUntriedMoves(node) {
        if (node.untriedMoves === null) {
            node.untriedMoves = getMoves();
            shuffleArray(node.untriedMoves);
        }
    }

    function getMoveWeight(move) {
        const mt = move.type;
        if (mt === 'tableau_multi_to_slot') return 150;
        if (mt === 'tableau_to_slot' || mt === 'tableau_gold_to_slot' || mt === 'display_to_slot' || mt === 'display_gold_to_slot') {
            return 100;
        }
        if (mt === 'tableau_to_column' || mt === 'tableau_multi_to_column') return 50;
        if (mt === 'display_to_column') return 20;
        if (mt === 'flip_hand') return 20;
        return 10; // recycle
    }

    function greedyRolloutChoice(moves) {
        let bestWeight = -1;
        let candidates = [];
        for (const m of moves) {
            const w = getMoveWeight(m);
            if (w > bestWeight) {
                bestWeight = w;
                candidates = [m];
            } else if (w === bestWeight) {
                candidates.push(m);
            }
        }
        if (candidates.length === 1) return candidates[0];
        return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function rollout() {
        const rolloutUndos = [];
        const rolloutMoveTypes = [];
        let won = false;
        while (state.stepsLeft > 0) {
            if (state.completedCount >= state.numCategories) {
                won = true;
                break;
            }
            const moves = getMoves();
            if (moves.length === 0) break;
            const move = greedyRolloutChoice(moves);
            rolloutUndos.push(applyMove(move));
            rolloutMoveTypes.push(move.type);
            nodesExplored++;
        }
        const stepsUsed = maxSteps - state.stepsLeft;
        for (let i = rolloutUndos.length - 1; i >= 0; i--) {
            undoMove(rolloutUndos[i]);
        }
        return { won, stepsUsed, rolloutMoveTypes };
    }

    function mctsIterate(root) {
        // SELECT
        let node = root;
        const pathUndos = [];
        const pathMoveTypes = [];
        while (node.untriedMoves !== null && node.untriedMoves.length === 0 && node.children.length > 0) {
            node = bestChild(node);
            pathUndos.push(applyMove(node.move));
            pathMoveTypes.push(node.move.type);
            nodesExplored++;
        }

        // Check if already won
        if (state.completedCount >= state.numCategories) {
            const stepsUsed = maxSteps - state.stepsLeft;
            if (bestSteps === null || stepsUsed < bestSteps) {
                bestSteps = stepsUsed;
                bestMoveTypes = [...pathMoveTypes];
            }
            let n = node;
            while (n !== null) {
                n.visits++;
                n.wins++;
                n.totalSteps += stepsUsed;
                n = n.parent;
            }
            for (let i = pathUndos.length - 1; i >= 0; i--) undoMove(pathUndos[i]);
            return;
        }

        // EXPAND
        initUntriedMoves(node);
        if (node.untriedMoves.length > 0) {
            const move = node.untriedMoves.pop();
            const child = createNode(node, move, node.depth + 1);
            node.children.push(child);
            pathUndos.push(applyMove(move));
            pathMoveTypes.push(move.type);
            nodesExplored++;
            node = child;
        }

        // SIMULATE
        const { won, stepsUsed, rolloutMoveTypes } = rollout();
        if (won && (bestSteps === null || stepsUsed < bestSteps)) {
            bestSteps = stepsUsed;
            bestMoveTypes = [...pathMoveTypes, ...rolloutMoveTypes];
        }

        // BACKPROPAGATE
        let n = node;
        while (n !== null) {
            n.visits++;
            if (won) {
                n.wins++;
                n.totalSteps += stepsUsed;
            }
            n = n.parent;
        }

        // Undo path
        for (let i = pathUndos.length - 1; i >= 0; i--) {
            undoMove(pathUndos[i]);
        }
    }

    const root = createNode(null, null, 0);
    initUntriedMoves(root);

    for (let iter = 0; iter < mctsIterations; iter++) {
        mctsIterate(root);
        if (nodesExplored > MAX_NODES) break;
    }

    const solvable = bestSteps !== null;
    const mctsMoveStats = emptyMoveStats();
    if (solvable && bestMoveTypes) {
        for (const mt of bestMoveTypes) {
            const cat = classifyMove(mt);
            if (cat) mctsMoveStats[cat]++;
        }
    }
    return {
        solvable,
        nodesExplored,
        stepsUsed: solvable ? bestSteps : 0,
        moveStats: mctsMoveStats,
    };
}

// ─── Layout Quality Validation ────────────────────────────────────

function tryGreedyDrag(simTableau, simDisplay, simSlots, categoryTargets) {
    // Priority 1: face-up tableau card → matching slot (collect)
    for (let ci = 0; ci < simTableau.length; ci++) {
        const col = simTableau[ci];
        if (!col.length || !col[col.length - 1].faceUp) continue;
        const card = col[col.length - 1].card;
        if (card.type === 'regular') {
            for (let si = 0; si < simSlots.length; si++) {
                const s = simSlots[si];
                if (s !== null && s.key === card.category && s.collected < s.target) {
                    col.pop();
                    s.collected++;
                    if (s.collected >= s.target) simSlots[si] = null;
                    if (col.length && !col[col.length - 1].faceUp) col[col.length - 1].faceUp = true;
                    return true;
                }
            }
        }
    }

    // Priority 1b: face-up tableau gold → empty slot
    for (let ci = 0; ci < simTableau.length; ci++) {
        const col = simTableau[ci];
        if (!col.length || !col[col.length - 1].faceUp) continue;
        const card = col[col.length - 1].card;
        if (card.type === 'gold') {
            for (let si = 0; si < simSlots.length; si++) {
                if (simSlots[si] === null) {
                    col.pop();
                    simSlots[si] = {
                        key: card.category,
                        collected: 0,
                        target: categoryTargets[card.category] || 0,
                    };
                    if (col.length && !col[col.length - 1].faceUp) col[col.length - 1].faceUp = true;
                    return true;
                }
            }
        }
    }

    // Priority 1c: hand display top → matching slot
    if (simDisplay.length > 0) {
        const top = simDisplay[simDisplay.length - 1];
        if (top.type === 'regular') {
            for (let si = 0; si < simSlots.length; si++) {
                const s = simSlots[si];
                if (s !== null && s.key === top.category && s.collected < s.target) {
                    simDisplay.pop();
                    s.collected++;
                    if (s.collected >= s.target) simSlots[si] = null;
                    return true;
                }
            }
        }
        if (top.type === 'gold') {
            for (let si = 0; si < simSlots.length; si++) {
                if (simSlots[si] === null) {
                    simDisplay.pop();
                    simSlots[si] = {
                        key: top.category,
                        collected: 0,
                        target: categoryTargets[top.category] || 0,
                    };
                    return true;
                }
            }
        }
    }

    // Priority 2: tableau → same-category column (stack)
    for (let ci = 0; ci < simTableau.length; ci++) {
        const col = simTableau[ci];
        if (!col.length || !col[col.length - 1].faceUp) continue;
        const card = col[col.length - 1].card;
        if (card.type === 'gold') continue;
        for (let ti = 0; ti < simTableau.length; ti++) {
            if (ti === ci || !simTableau[ti].length) continue;
            const topTc = simTableau[ti][simTableau[ti].length - 1];
            if (topTc.card.type === 'gold') continue;
            if (card.category === topTc.card.category) {
                const tc = col.pop();
                simTableau[ti].push(tc);
                if (col.length && !col[col.length - 1].faceUp) col[col.length - 1].faceUp = true;
                return true;
            }
        }
    }

    // Priority 3: hand display → column (stack)
    if (simDisplay.length > 0) {
        const top = simDisplay[simDisplay.length - 1];
        for (let ti = 0; ti < simTableau.length; ti++) {
            if (!simTableau[ti].length) {
                simDisplay.pop();
                simTableau[ti].push({ card: top, faceUp: true });
                return true;
            }
            const topTc = simTableau[ti][simTableau[ti].length - 1];
            if (topTc.card.type === 'gold') continue;
            if (top.category === topTc.card.category) {
                simDisplay.pop();
                simTableau[ti].push({ card: top, faceUp: true });
                return true;
            }
        }
    }

    return false;
}

function validateLayout(tableau, handPile, categoryTargets, maxSlots) {
    // ── 条件 3：金牌可及性 ──
    let goldAccessible = false;
    for (const col of tableau) {
        if (col.length && col[col.length - 1].faceUp && col[col.length - 1].card.type === 'gold') {
            goldAccessible = true;
            break;
        }
    }
    if (!goldAccessible) {
        for (let i = 0; i < Math.min(5, handPile.length); i++) {
            if (handPile[i].type === 'gold') {
                goldAccessible = true;
                break;
            }
        }
    }
    if (!goldAccessible) return false;

    // ── 条件 1：开局可操作 ──
    const faceUpCards = []; // [{colIdx, card}]
    for (let ci = 0; ci < tableau.length; ci++) {
        const col = tableau[ci];
        if (col.length && col[col.length - 1].faceUp) {
            faceUpCards.push({ colIdx: ci, card: col[col.length - 1].card });
        }
    }

    let hasImmediateMove = false;

    for (let i = 0; i < faceUpCards.length; i++) {
        const { card: cardI } = faceUpCards[i];
        if (cardI.type === 'gold') {
            hasImmediateMove = true;
            break;
        }
        for (let j = 0; j < faceUpCards.length; j++) {
            if (i !== j && cardI.category === faceUpCards[j].card.category) {
                hasImmediateMove = true;
                break;
            }
        }
        if (hasImmediateMove) break;
    }

    if (!hasImmediateMove) {
        for (let k = 0; k < Math.min(2, handPile.length); k++) {
            const card = handPile[k];
            if (card.type === 'gold') {
                hasImmediateMove = true;
                break;
            }
            for (const fu of faceUpCards) {
                if (card.category === fu.card.category) {
                    hasImmediateMove = true;
                    break;
                }
            }
            if (hasImmediateMove) break;
        }
    }

    if (!hasImmediateMove) return false;

    // ── 条件 2：前期流畅性（贪心模拟）──
    const simTableau = tableau.map(col => col.map(tc => ({ card: { ...tc.card }, faceUp: tc.faceUp })));
    const simHand = handPile.map(c => ({ ...c }));
    const simDisplay = [];
    const simSlots = new Array(maxSlots).fill(null);

    let dragCount = 0;
    let consecFlips = 0;

    for (let step = 0; step < 20; step++) {
        if (dragCount >= 5) break;

        const didDrag = tryGreedyDrag(simTableau, simDisplay, simSlots, categoryTargets);

        if (didDrag) {
            dragCount++;
            consecFlips = 0;
        } else {
            if (simHand.length > 0) {
                simDisplay.push(simHand.shift());
                consecFlips++;
                if (consecFlips > 3) return false;
            } else {
                break;
            }
        }
    }

    return true;
}

// ─── Generator Logic ───────────────────────────────────────────────

// ─── Move Stats Helpers ───────────────────────────────────────────

function emptyMoveStats() {
    return {
        colSingleToSlot: 0, colMultiToSlot: 0, colToCol: 0, colMultiToCol: 0,
        handToSlot: 0, handToCol: 0, flip: 0, recycle: 0,
    };
}

function classifyMove(moveType) {
    if (moveType === 'tableau_to_slot' || moveType === 'tableau_gold_to_slot') return 'colSingleToSlot';
    if (moveType === 'tableau_multi_to_slot') return 'colMultiToSlot';
    if (moveType === 'tableau_to_column') return 'colToCol';
    if (moveType === 'tableau_multi_to_column') return 'colMultiToCol';
    if (moveType === 'display_to_slot' || moveType === 'display_gold_to_slot') return 'handToSlot';
    if (moveType === 'display_to_column') return 'handToCol';
    if (moveType === 'flip_hand') return 'flip';
    if (moveType === 'recycle') return 'recycle';
    return null;
}

// ─── Decision Tree Constants (competitor-style) ──────────────────
const MAX_TREE_DEPTH = 8;
const MAX_POSSIBLE_MOVES = 50;
const MAX_SOLVER_STEPS = 5000;
const MAX_SOLVER_ROUNDS = 3;
const GREEDY_PHASE_RATIO = 0.6;    // 前N%步数纯贪心（无回溯），之后启用决策树回溯
const MAX_CONSECUTIVE_FLIPS = 9;   // 连续翻手牌上限，超过则判定 layout 无效
const MAX_CONSECUTIVE_FLIP_DRAGS = 7;   // 连续翻拖绝对上限
const MAX_FLIP_DRAGS_STRICT = 5;       // 手牌充足且桌面有牌时的严格上限
const FLIP_DRAG_HAND_THRESHOLD = 15;   // 严格限制的手牌剩余阈值
const FLIP_DRAG_TABLEAU_THRESHOLD = 3;  // 严格限制的桌面牌阈值

const LOW_PRIORITY = 1;
const NORMAL_PRIORITY = 2;
const HIGH_PRIORITY = 3;
// Old multiplier constants kept for reference but no longer used in getPriorityWeight
const PLACE_TO_HOME_MUL = 4;
const PLACE_TO_PLAY_STACK_MUL = 2;
const STOCK_CARD_MUL = 1;

// ─── Priority + Equality Backtracking Solver ──────────────────────

function solveLevel(tableau, categoryTargets, maxSteps, maxSlots, handPile, conservative, priorityOnly, greedyOnly, displaySteps, rejectGreedyTies) {
    if (conservative === undefined) conservative = false;
    if (priorityOnly === undefined) priorityOnly = false;
    if (greedyOnly === undefined) greedyOnly = false;
    if (displaySteps === undefined) displaySteps = maxSteps;
    if (rejectGreedyTies === undefined) rejectGreedyTies = false;
    const MAX_RECYCLES_SL = 3;

    // Greedy phase threshold: first N steps are pure greedy (no backtracking)
    const greedyStepLimit = Math.floor(displaySteps * GREEDY_PHASE_RATIO);

    // Seeded PRNG (mulberry32) for reproducible random choices within solver
    let _rngState = (Date.now() ^ 0x5DEECE66D) >>> 0;
    function seedRng(s) { _rngState = s >>> 0; }
    function rng() {
        _rngState |= 0; _rngState = (_rngState + 0x6D2B79F5) | 0;
        let t = Math.imul(_rngState ^ (_rngState >>> 15), 1 | _rngState);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    // Deep clone state
    const state = {
        tableau: tableau.map(col => col.map(tc => ({ card: { ...tc.card }, faceUp: tc.faceUp }))),
        slots: new Array(maxSlots).fill(null),
        stepsLeft: maxSteps,
        completedCount: 0,
        numCategories: Object.keys(categoryTargets).length,
        handPile: [...handPile].map(c => ({ ...c })),
        handDisplay: [],
        recycleCount: 0,
    };

    let nodesExplored = 0;
    const seenSinceDrag = new Set();

    function isSoftDeadlock() {
        const totalHand = state.handPile.length + state.handDisplay.length;
        if (seenSinceDrag.size < totalHand) return false;
        for (let ci = 0; ci < state.tableau.length; ci++) {
            const col = state.tableau[ci];
            if (!col.length || !col[col.length - 1].faceUp) continue;
            const top = col[col.length - 1].card;
            if (top.type === 'regular') {
                for (const s of state.slots) {
                    if (s !== null && s.key === top.category && s.collected < s.target) return false;
                }
            }
            if (top.type === 'gold' && state.slots.some(s => s === null)) return false;
            // Can move to another column? (skip weight=0: no facedown + empty target)
            const hasFacedown = col.length >= 2 && !col[col.length - 2].faceUp;
            for (let ti = 0; ti < state.tableau.length; ti++) {
                if (ti === ci) continue;
                if (!hasFacedown && state.tableau[ti].length === 0) continue;
                if (canStackOnColumn(top, state.tableau[ti])) return false;
            }
        }
        if (state.handDisplay.length > 0) {
            const hc = state.handDisplay[state.handDisplay.length - 1];
            if (hc.type === 'regular') {
                for (const s of state.slots) {
                    if (s !== null && s.key === hc.category && s.collected < s.target) return false;
                }
            }
            if (hc.type === 'gold' && state.slots.some(s => s === null)) return false;
            for (let ti = 0; ti < state.tableau.length; ti++) {
                if (canStackOnColumn(hc, state.tableau[ti])) return false;
            }
        }
        return true;
    }

    function getTopCard(col) {
        return col.length > 0 ? col[col.length - 1] : null;
    }

    // Conservative mode helpers
    function hasTableauRegularFor(cat) {
        for (const col of state.tableau) {
            for (const tc of col) {
                if (tc.faceUp && tc.card.type === 'regular' && tc.card.category === cat) return true;
            }
        }
        return false;
    }
    function isCatCompleted(cat) {
        for (const s of state.slots) {
            if (s !== null && s.key === cat && s.collected >= s.target) return true;
        }
        return false;
    }
    function isCatAllRegularsOnTableau(cat) {
        const target = categoryTargets[cat] || 0;
        if (target <= 0) return false;
        for (const col of state.tableau) {
            let count = 0;
            for (const tc of col) {
                if (tc.faceUp && tc.card.type === 'regular' && tc.card.category === cat) count++;
            }
            if (count >= target) return true;
        }
        return false;
    }

    function getMoves() {
        const moves = [];
        const hasEmptySlot = state.slots.some(s => s === null);

        for (let ci = 0; ci < state.tableau.length; ci++) {
            const col = state.tableau[ci];
            const top = getTopCard(col);
            if (!top || !top.faceUp) continue;

            const topIdx = col.length - 1;
            const cat = col[topIdx].card.category;
            let startIdx = topIdx;
            while (startIdx > 0 && col[startIdx - 1].faceUp && col[startIdx - 1].card.category === cat) {
                startIdx--;
            }
            const dragCount = topIdx - startIdx + 1;

            let addedMulti = false;
            if (dragCount >= 2) {
                // Case A: gold on top + regulars below → to empty slot
                if (col[topIdx].card.type === 'gold' && hasEmptySlot) {
                    let allRegular = true;
                    for (let i = startIdx; i < topIdx; i++) {
                        if (col[i].card.type !== 'regular') { allRegular = false; break; }
                    }
                    if (allRegular) {
                        moves.push({ type: 'tableau_multi_to_slot', colIdx: ci, startIdx, count: dragCount });
                        addedMulti = true;
                    }
                }
                // Case C: gold on bottom + regulars above → to empty slot
                if (!addedMulti && col[startIdx].card.type === 'gold' && hasEmptySlot) {
                    let allRegular = true;
                    for (let i = startIdx + 1; i <= topIdx; i++) {
                        if (col[i].card.type !== 'regular') { allRegular = false; break; }
                    }
                    if (allRegular) {
                        moves.push({ type: 'tableau_multi_to_slot', colIdx: ci, startIdx, count: dragCount });
                        addedMulti = true;
                    }
                }
                // Case B: all regular → match existing slot
                if (!addedMulti) {
                    let allRegular = true;
                    for (let i = startIdx; i <= topIdx; i++) {
                        if (col[i].card.type !== 'regular') { allRegular = false; break; }
                    }
                    if (allRegular) {
                        const si = state.slots.findIndex(s => s !== null && s.key === cat && s.collected + dragCount <= s.target);
                        if (si !== -1) {
                            moves.push({ type: 'tableau_multi_to_slot', colIdx: ci, startIdx, count: dragCount });
                            addedMulti = true;
                        }
                    }
                }
            }

            // Single card to slot (skip if multi already covers this card)
            if (top.card.type === 'regular' && !addedMulti) {
                const slotIdx = state.slots.findIndex(
                    s => s !== null && s.key === top.card.category && s.collected < s.target
                );
                if (slotIdx !== -1) {
                    moves.push({ type: 'tableau_to_slot', colIdx: ci, slotIdx });
                }
            }
            if (top.card.type === 'gold' && hasEmptySlot && !addedMulti) {
                moves.push({ type: 'tableau_gold_to_slot', colIdx: ci });
            }
        }

        if (state.handDisplay.length > 0) {
            const topCard = state.handDisplay[state.handDisplay.length - 1];
            if (topCard.type === 'regular') {
                const slotIdx = state.slots.findIndex(
                    s => s !== null && s.key === topCard.category && s.collected < s.target
                );
                if (slotIdx !== -1) {
                    moves.push({ type: 'display_to_slot', slotIdx });
                }
            }
            if (topCard.type === 'gold' && hasEmptySlot) {
                if (!conservative || hasTableauRegularFor(topCard.category)) {
                    moves.push({ type: 'display_gold_to_slot' });
                }
            }
        }

        for (let ci = 0; ci < state.tableau.length; ci++) {
            const col = state.tableau[ci];
            const top = getTopCard(col);
            if (!top || !top.faceUp) continue;
            for (let ti = 0; ti < state.tableau.length; ti++) {
                if (ti === ci) continue;
                // Conservative: gold cards can only move column-to-column if category completed
                // Exception: allow if source has face-down card AND target is empty
                if (conservative && top.card.type === 'gold' && !isCatAllRegularsOnTableau(top.card.category)) {
                    const hasFacedown = col.length >= 2 && !col[col.length - 2].faceUp;
                    if (!(hasFacedown && state.tableau[ti].length === 0)) continue;
                }
                if (canStackOnColumn(top.card, state.tableau[ti])) {
                    moves.push({ type: 'tableau_to_column', srcCol: ci, dstCol: ti });
                }
            }
        }

        // Tableau → column (multi-card: consecutive same-category face-up cards ≥2)
        for (let ci = 0; ci < state.tableau.length; ci++) {
            const col = state.tableau[ci];
            if (!col.length) continue;
            const topIdx = col.length - 1;
            if (!col[topIdx].faceUp) continue;
            const cat = col[topIdx].card.category;
            let startIdx = topIdx;
            while (startIdx > 0 && col[startIdx - 1].faceUp && col[startIdx - 1].card.category === cat) {
                startIdx--;
            }
            const dragCount = topIdx - startIdx + 1;
            if (dragCount < 2) continue;
            // Conservative: if top card is gold, only allow if category completed
            // Exception: allow if source has face-down card AND target is empty
            const isConsGoldBlocked = conservative && col[topIdx].card.type === 'gold' && !isCatAllRegularsOnTableau(cat);
            const consHasFacedown = startIdx > 0 && !col[startIdx - 1].faceUp;
            const bottomCard = col[startIdx].card;
            for (let ti = 0; ti < state.tableau.length; ti++) {
                if (ti === ci) continue;
                if (isConsGoldBlocked && !(consHasFacedown && state.tableau[ti].length === 0)) continue;
                if (canStackOnColumn(bottomCard, state.tableau[ti])) {
                    moves.push({ type: 'tableau_multi_to_column', srcCol: ci, dstCol: ti, startIdx, count: dragCount });
                }
            }
        }

        if (state.handDisplay.length > 0) {
            const topCard = state.handDisplay[state.handDisplay.length - 1];
            // Conservative: gold in hand + no free slots → only if category completed
            const freeSlots = state.slots.filter(s => s === null).length;
            const skipGoldCol = conservative && topCard.type === 'gold' && freeSlots === 0 && !isCatAllRegularsOnTableau(topCard.category);
            for (let ti = 0; ti < state.tableau.length; ti++) {
                if (!skipGoldCol && canStackOnColumn(topCard, state.tableau[ti])) {
                    moves.push({ type: 'display_to_column', dstCol: ti });
                }
            }
        }

        if (state.handPile.length > 0) {
            moves.push({ type: 'flip_hand' });
        }

        if (state.handPile.length === 0 && state.handDisplay.length > 0 && state.recycleCount < MAX_RECYCLES_SL) {
            moves.push({ type: 'recycle' });
        }

        return moves;
    }

    function autoFlip(col) {
        if (col.length > 0 && !col[col.length - 1].faceUp) {
            col[col.length - 1].faceUp = true;
            return true;
        }
        return false;
    }

    function applyMove(move) {
        const undo = { type: move.type };

        if (move.type === 'tableau_multi_to_slot') {
            state.stepsLeft--;
            const col = state.tableau[move.colIdx];
            const removed = col.splice(move.startIdx);
            undo.colIdx = move.colIdx;
            undo.removed = removed;
            undo.startIdx = move.startIdx;

            const topCard = removed[removed.length - 1];
            const bottomCard = removed[0];
            const goldCard = topCard.card.type === 'gold' ? topCard : (bottomCard.card.type === 'gold' ? bottomCard : null);
            if (goldCard) {
                const emptyIdx = state.slots.findIndex(s => s === null);
                const regularCount = removed.length - 1;
                const target = categoryTargets[goldCard.card.category] || 0;
                state.slots[emptyIdx] = { key: goldCard.card.category, collected: regularCount, target };
                undo.slotIdx = emptyIdx;
                undo.slotWasNone = true;
                if (regularCount >= target) {
                    undo.completed = { ...state.slots[emptyIdx] };
                    state.slots[emptyIdx] = null;
                    state.completedCount++;
                }
            } else {
                const cat = removed[0].card.category;
                const si = state.slots.findIndex(s => s !== null && s.key === cat);
                if (si !== -1) {
                    undo.slotIdx = si;
                    undo.slotWasNone = false;
                    undo.prevCollected = state.slots[si].collected;
                    state.slots[si].collected += removed.length;
                    if (state.slots[si].collected >= state.slots[si].target) {
                        undo.completed = { ...state.slots[si] };
                        state.slots[si] = null;
                        state.completedCount++;
                    }
                }
            }
            undo.flipped = autoFlip(col);

        } else if (move.type === 'tableau_to_slot') {
            state.stepsLeft--;
            const col = state.tableau[move.colIdx];
            const tc = col.pop();
            undo.colIdx = move.colIdx;
            undo.tc = tc;
            undo.slotIdx = move.slotIdx;

            const slot = state.slots[move.slotIdx];
            undo.prevCollected = slot.collected;
            slot.collected++;
            if (slot.collected >= slot.target) {
                undo.completed = { ...slot };
                state.slots[move.slotIdx] = null;
                state.completedCount++;
            }
            undo.flipped = autoFlip(col);

        } else if (move.type === 'tableau_gold_to_slot') {
            state.stepsLeft--;
            const col = state.tableau[move.colIdx];
            const tc = col.pop();
            undo.colIdx = move.colIdx;
            undo.tc = tc;

            const emptyIdx = state.slots.findIndex(s => s === null);
            state.slots[emptyIdx] = {
                key: tc.card.category,
                collected: 0,
                target: categoryTargets[tc.card.category] || 0,
            };
            undo.slotIdx = emptyIdx;
            undo.flipped = autoFlip(col);

        } else if (move.type === 'display_to_slot') {
            state.stepsLeft--;
            const card = state.handDisplay.pop();
            undo.card = card;
            undo.slotIdx = move.slotIdx;

            const slot = state.slots[move.slotIdx];
            undo.prevCollected = slot.collected;
            slot.collected++;
            if (slot.collected >= slot.target) {
                undo.completed = { ...slot };
                state.slots[move.slotIdx] = null;
                state.completedCount++;
            }

        } else if (move.type === 'display_gold_to_slot') {
            state.stepsLeft--;
            const card = state.handDisplay.pop();
            undo.card = card;
            const emptyIdx = state.slots.findIndex(s => s === null);
            state.slots[emptyIdx] = {
                key: card.category,
                collected: 0,
                target: categoryTargets[card.category] || 0,
            };
            undo.slotIdx = emptyIdx;

        } else if (move.type === 'tableau_to_column') {
            state.stepsLeft--;
            const srcCol = state.tableau[move.srcCol];
            const tc = srcCol.pop();
            undo.srcCol = move.srcCol;
            undo.dstCol = move.dstCol;
            undo.tc = tc;
            state.tableau[move.dstCol].push(tc);
            undo.flipped = autoFlip(srcCol);

        } else if (move.type === 'tableau_multi_to_column') {
            state.stepsLeft--;
            const srcCol = state.tableau[move.srcCol];
            const startIdx = move.startIdx;
            const removed = srcCol.splice(startIdx);
            undo.srcCol = move.srcCol;
            undo.dstCol = move.dstCol;
            undo.removed = removed;
            undo.startIdx = startIdx;
            state.tableau[move.dstCol].push(...removed);
            undo.flipped = autoFlip(srcCol);

        } else if (move.type === 'display_to_column') {
            state.stepsLeft--;
            const card = state.handDisplay.pop();
            undo.card = card;
            undo.dstCol = move.dstCol;
            state.tableau[move.dstCol].push({ card, faceUp: true });

        } else if (move.type === 'flip_hand') {
            state.stepsLeft--;
            const card = state.handPile.pop();
            state.handDisplay.push(card);
            undo.card = card;

        } else if (move.type === 'recycle') {
            state.stepsLeft--;
            undo.displaySnapshot = [...state.handDisplay];
            state.handPile = [...state.handDisplay].reverse();
            state.handDisplay = [];
            state.recycleCount++;
        }

        return undo;
    }

    function undoMove(undo) {
        if (undo.type === 'tableau_multi_to_slot') {
            state.stepsLeft++;
            const col = state.tableau[undo.colIdx];
            if (undo.flipped) col[col.length - 1].faceUp = false;
            col.push(...undo.removed);
            if (undo.completed) state.completedCount--;
            if (undo.slotWasNone) {
                state.slots[undo.slotIdx] = null;
            } else {
                if (state.slots[undo.slotIdx] === null && undo.completed) {
                    state.slots[undo.slotIdx] = undo.completed;
                }
                state.slots[undo.slotIdx].collected = undo.prevCollected;
            }

        } else if (undo.type === 'tableau_to_slot') {
            state.stepsLeft++;
            if (undo.flipped) state.tableau[undo.colIdx][state.tableau[undo.colIdx].length - 1].faceUp = false;
            state.tableau[undo.colIdx].push(undo.tc);
            if (undo.completed) {
                state.completedCount--;
                state.slots[undo.slotIdx] = undo.completed;
                state.slots[undo.slotIdx].collected = undo.prevCollected;
            } else {
                state.slots[undo.slotIdx].collected--;
            }

        } else if (undo.type === 'tableau_gold_to_slot') {
            state.stepsLeft++;
            if (undo.flipped) state.tableau[undo.colIdx][state.tableau[undo.colIdx].length - 1].faceUp = false;
            state.tableau[undo.colIdx].push(undo.tc);
            state.slots[undo.slotIdx] = null;

        } else if (undo.type === 'display_to_slot') {
            state.stepsLeft++;
            if (undo.completed) {
                state.completedCount--;
                state.slots[undo.slotIdx] = undo.completed;
                state.slots[undo.slotIdx].collected = undo.prevCollected;
            } else {
                state.slots[undo.slotIdx].collected--;
            }
            state.handDisplay.push(undo.card);

        } else if (undo.type === 'display_gold_to_slot') {
            state.stepsLeft++;
            state.slots[undo.slotIdx] = null;
            state.handDisplay.push(undo.card);

        } else if (undo.type === 'tableau_to_column') {
            state.stepsLeft++;
            state.tableau[undo.dstCol].pop();
            if (undo.flipped) state.tableau[undo.srcCol][state.tableau[undo.srcCol].length - 1].faceUp = false;
            state.tableau[undo.srcCol].push(undo.tc);

        } else if (undo.type === 'tableau_multi_to_column') {
            state.stepsLeft++;
            const dstCol = state.tableau[undo.dstCol];
            dstCol.splice(dstCol.length - undo.removed.length);
            if (undo.flipped) state.tableau[undo.srcCol][state.tableau[undo.srcCol].length - 1].faceUp = false;
            state.tableau[undo.srcCol].push(...undo.removed);

        } else if (undo.type === 'display_to_column') {
            state.stepsLeft++;
            state.tableau[undo.dstCol].pop();
            state.handDisplay.push(undo.card);

        } else if (undo.type === 'flip_hand') {
            state.stepsLeft++;
            state.handDisplay.pop();
            state.handPile.push(undo.card);

        } else if (undo.type === 'recycle') {
            state.stepsLeft++;
            state.handDisplay = undo.displaySnapshot;
            state.handPile = [];
            state.recycleCount--;
        }
    }

    function getPriorityWeight(move) {
        /* Weight system (HINT_AND_SOLVER_DESIGN.md §2.4, scaled ×2):
         *  14 = complete category (frees slot)
         *  10 = column move revealing face-down (doc: 5)
         *   8 = categorize + reveal face-down, free slots > 1 (doc: 4)
         *   6 = safe categorize / clear column / hand→slot free>1 (doc: 3)
         *   4 = tight categorize / hand→column (doc: 2)
         *   2 = gold when tight / flip / recycle (doc: 1)
         */
        const mt = move.type;
        const freeSlots = state.slots.filter(s => s === null).length;

        // ── Column moves ──
        if (mt === 'tableau_to_column') {
            const col = state.tableau[move.srcCol];
            const dstCol = state.tableau[move.dstCol];
            const hasFacedown = col.length >= 2 && !col[col.length - 2].faceUp;
            const topCard = col[col.length - 1].card;
            if (!hasFacedown && dstCol.length === 0) return 0;
            if (hasFacedown) {
                // 金牌移动到空列翻暗牌：权重5
                if (topCard.type === 'gold' && dstCol.length === 0) return 5;
                return 6;
            }
            return 3;
        }
        if (mt === 'tableau_multi_to_column') {
            const col = state.tableau[move.srcCol];
            const dstCol = state.tableau[move.dstCol];
            const startIdx = move.startIdx;
            const hasFacedown = startIdx > 0 && !col[startIdx - 1].faceUp;
            const topCard = col[col.length - 1].card;
            if (!hasFacedown && dstCol.length === 0) return 0;
            if (hasFacedown) {
                if (topCard.type === 'gold' && dstCol.length === 0) return 5;
                return 6;
            }
            return 3;
        }

        // ── Tableau regular → slot ──
        if (mt === 'tableau_to_slot') {
            const card = state.tableau[move.colIdx][state.tableau[move.colIdx].length - 1].card;
            for (const s of state.slots) {
                if (s !== null && s.key === card.category) {
                    if (s.collected + 1 >= s.target) return 16;
                    break;
                }
            }
            return 14;
        }

        // ── Tableau gold → slot ──
        if (mt === 'tableau_gold_to_slot') {
            return 10;
        }

        // ── Tableau multi → slot ──
        if (mt === 'tableau_multi_to_slot') {
            const col = state.tableau[move.colIdx];
            const startIdx = move.startIdx || 0;
            const topCard = col[col.length - 1];
            const bottomCard = col[startIdx];
            const isGoldMove = topCard.card.type === 'gold' || bottomCard.card.type === 'gold';
            const numCards = col.length - startIdx;
            if (isGoldMove) {
                const catKey = col[col.length - 1].card.category;
                const numRegulars = numCards - 1;
                const target = categoryTargets[catKey] || 0;
                if (numRegulars >= target) return 16;
                return 10;
            }
            const catKey = col[col.length - 1].card.category;
            for (const s of state.slots) {
                if (s !== null && s.key === catKey) {
                    if (s.collected + numCards >= s.target) return 16;
                    break;
                }
            }
            return 14;
        }

        // ── Hand display → slot ──
        if (mt === 'display_to_slot') {
            const card = state.handDisplay[state.handDisplay.length - 1];
            for (const s of state.slots) {
                if (s !== null && s.key === card.category) {
                    if (s.collected + 1 >= s.target) return 16;
                    break;
                }
            }
            return 12;
        }
        if (mt === 'display_gold_to_slot') {
            return 8;
        }

        // ── Hand display → column ──
        if (mt === 'display_to_column') return 4;

        // ── Flip / recycle ──
        if (mt === 'flip_hand') return 2;
        if (mt === 'recycle') return 1;

        return 0;
    }

    function countFacedown(colIdx) {
        return state.tableau[colIdx].filter(tc => !tc.faceUp).length;
    }

    function getTiebreakKey(move) {
        const w = getPriorityWeight(move);
        const mt = move.type;

        // Weight 6 (列间移动翻暗牌): source with fewer face-down first
        if (w === 6) {
            return countFacedown(move.srcCol);
        }

        // Weight 14 (桌面基础牌归类): source with fewer face-down first
        if (w === 14) {
            return countFacedown(move.colIdx);
        }

        // Weight 10 (桌面含类别牌收集): source with fewer face-down first
        if (w === 10) {
            return countFacedown(move.colIdx);
        }

        // Weight 3 (列间归拢同类别): prefer target column with more same-category cards
        if (w === 3) {
            const dstCol = state.tableau[move.dstCol];
            let cardCat = null;
            if (mt === 'tableau_to_column') {
                const srcCol = state.tableau[move.srcCol];
                cardCat = srcCol[srcCol.length - 1].card.category;
            } else if (mt === 'tableau_multi_to_column') {
                cardCat = state.tableau[move.srcCol][move.startIdx].card.category;
            }
            if (cardCat) {
                let sameCount = 0;
                for (const tc of dstCol) {
                    if (tc.faceUp && tc.card.category === cardCat) sameCount++;
                }
                return -sameCount;
            }
            return 0;
        }

        // Weight 4 (手牌放列): prefer target column with more same-category cards
        if (w === 4) {
            const dstCol = state.tableau[move.dstCol];
            if (state.handDisplay.length > 0) {
                const cardCat = state.handDisplay[state.handDisplay.length - 1].category;
                let sameCount = 0;
                for (const tc of dstCol) {
                    if (tc.faceUp && tc.card.category === cardCat) sameCount++;
                }
                return -sameCount;
            }
            return 0;
        }

        // All other weights: no tiebreak (random)
        return 0;
    }

    function solveWithBacktracking(usePriority) {
        let totalSteps = 0;
        const moveSequence = [];
        const movePath = [];      // track full move objects for path output

        const stack = [];

        function tooManyConsecutiveFlips(seq) {
            if (seq.length < MAX_CONSECUTIVE_FLIPS) return false;
            for (let i = 0; i < MAX_CONSECUTIVE_FLIPS; i++) {
                if (seq[seq.length - 1 - i] !== 'flip_hand') return false;
            }
            return true;
        }

        function tooManyFlipDrags(seq) {
            const dragTypes = new Set(['display_to_slot', 'display_to_column', 'display_gold_to_slot']);
            function checkLimit(s, limit) {
                const n = limit * 2;
                if (s.length < n) return false;
                for (let i = 0; i < limit; i++) {
                    const flipIdx = s.length - n + i * 2;
                    const dragIdx = flipIdx + 1;
                    if (s[flipIdx] !== 'flip_hand' || !dragTypes.has(s[dragIdx])) return false;
                }
                return true;
            }
            // Absolute limit
            if (checkLimit(seq, MAX_CONSECUTIVE_FLIP_DRAGS)) return true;
            // Strict limit: estimate state at streak start
            if (seq.length >= MAX_FLIP_DRAGS_STRICT * 2 && checkLimit(seq, MAX_FLIP_DRAGS_STRICT)) {
                const n = MAX_FLIP_DRAGS_STRICT * 2;
                const handAtStart = state.handPile.length + MAX_FLIP_DRAGS_STRICT;
                let colMoves = 0;
                for (let i = seq.length - n; i < seq.length; i++) {
                    if (seq[i] === 'display_to_column') colMoves++;
                }
                const tableauAtStart = state.tableau.reduce((s, col) => s + col.length, 0) - colMoves;
                if (handAtStart >= FLIP_DRAG_HAND_THRESHOLD && tableauAtStart >= FLIP_DRAG_TABLEAU_THRESHOLD) return true;
            }
            return false;
        }

        function pickGreedyMove(moves, rejectTies) {
            if (usePriority) {
                moves.sort((a, b) => {
                    const dw = getPriorityWeight(b) - getPriorityWeight(a);
                    if (dw !== 0) return dw;
                    return getTiebreakKey(a) - getTiebreakKey(b);
                });
                const topW = getPriorityWeight(moves[0]);
                const topTB = getTiebreakKey(moves[0]);
                let topCount = 1;
                while (topCount < moves.length && getPriorityWeight(moves[topCount]) === topW && getTiebreakKey(moves[topCount]) === topTB) topCount++;
                if (rejectTies && topCount > 1) return null;
                return moves[Math.floor(rng() * topCount)];
            } else {
                return moves[Math.floor(rng() * moves.length)];
            }
        }

        function getSortedCandidates() {
            let moves = getMoves();
            if (!moves.length) return [];
            if (moves.length > MAX_POSSIBLE_MOVES) moves = moves.slice(0, MAX_POSSIBLE_MOVES);
            if (usePriority) {
                moves.sort((a, b) => {
                    const dw = getPriorityWeight(b) - getPriorityWeight(a);
                    if (dw !== 0) return dw;
                    return getTiebreakKey(a) - getTiebreakKey(b);
                });
            }
            return moves;
        }

        function greedyPlayout() {
            const undos = [];
            const mtypes = [];
            const mdicts = [];
            let won = false;
            seenSinceDrag.clear();
            while (state.stepsLeft > 0) {
                if (state.completedCount >= state.numCategories) { won = true; break; }
                let moves = getMoves();
                if (!moves.length) break;
                let move;
                if (usePriority) {
                    moves.sort((a, b) => {
                        const dw = getPriorityWeight(b) - getPriorityWeight(a);
                        if (dw !== 0) return dw;
                        return getTiebreakKey(a) - getTiebreakKey(b);
                    });
                    const topW = getPriorityWeight(moves[0]);
                    const topTB = getTiebreakKey(moves[0]);
                    let topCount = 1;
                    while (topCount < moves.length && getPriorityWeight(moves[topCount]) === topW && getTiebreakKey(moves[topCount]) === topTB) topCount++;
                    move = moves[Math.floor(rng() * topCount)];
                } else {
                    move = moves[Math.floor(rng() * moves.length)];
                }
                undos.push(applyMove(move));
                mtypes.push(move.type);
                mdicts.push({...move});
                totalSteps++;
                nodesExplored++;
                // Soft deadlock tracking
                if (move.type === 'flip_hand') {
                    if (state.handDisplay.length > 0) {
                        seenSinceDrag.add(state.handDisplay[state.handDisplay.length - 1]);
                    }
                    if (isSoftDeadlock()) break;
                    if (tooManyConsecutiveFlips(moveSequence.concat(mtypes))) {
                        won = false;
                        break;
                    }
                } else if (move.type !== 'recycle') {
                    seenSinceDrag.clear();
                }
                // Consecutive flip-drag check
                if (move.type === 'display_to_slot' || move.type === 'display_to_column' || move.type === 'display_gold_to_slot') {
                    if (tooManyFlipDrags(moveSequence.concat(mtypes))) {
                        won = false;
                        break;
                    }
                }
                if (totalSteps > MAX_SOLVER_STEPS) break;
            }
            return { won, undos, mtypes, mdicts };
        }

        // ════════════════════════════════════════════════════════════
        // Phase 1: Greedy phase — pure greedy for first greedyStepLimit steps
        // ════════════════════════════════════════════════════════════
        const greedyUndos = [];
        seenSinceDrag.clear();
        let greedyPhaseOk = true;

        while (state.stepsLeft > 0 && totalSteps <= MAX_SOLVER_STEPS) {
            if (state.completedCount >= state.numCategories) {
                // Won during greedy phase!
                const stepsUsed = maxSteps - state.stepsLeft;
                const ms = emptyMoveStats();
                for (const mt of moveSequence) { const cat = classifyMove(mt); if (cat) ms[cat]++; }
                const resultPath = [...movePath];
                for (let i = greedyUndos.length - 1; i >= 0; i--) undoMove(greedyUndos[i]);
                moveSequence.length = 0;
                movePath.length = 0;
                return { won: true, stepsUsed, moveStats: ms, nodesExplored, movePath: resultPath };
            }

            const stepsUsed = maxSteps - state.stepsLeft;
            if (stepsUsed >= greedyStepLimit) break; // Greedy phase done, enter backtracking

            let moves = getMoves();
            if (!moves.length) { greedyPhaseOk = false; break; }

            const move = pickGreedyMove(moves, rejectGreedyTies && usePriority);
            if (move === null) { greedyPhaseOk = false; break; }
            greedyUndos.push(applyMove(move));
            moveSequence.push(move.type);
            movePath.push({...move});
            totalSteps++;
            nodesExplored++;

            // Soft deadlock tracking
            if (move.type === 'flip_hand') {
                if (state.handDisplay.length > 0) {
                    seenSinceDrag.add(state.handDisplay[state.handDisplay.length - 1]);
                }
                if (isSoftDeadlock()) { greedyPhaseOk = false; break; }
                if (tooManyConsecutiveFlips(moveSequence)) { greedyPhaseOk = false; break; }
            } else if (move.type !== 'recycle') {
                seenSinceDrag.clear();
            }
            // Consecutive flip-drag check
            if (move.type === 'display_to_slot' || move.type === 'display_to_column' || move.type === 'display_gold_to_slot') {
                if (tooManyFlipDrags(moveSequence)) { greedyPhaseOk = false; break; }
            }
        }

        if (!greedyPhaseOk) {
            // Stuck in greedy phase → layout invalid, undo and return null
            for (let i = greedyUndos.length - 1; i >= 0; i--) undoMove(greedyUndos[i]);
            moveSequence.length = 0;
            movePath.length = 0;
            return null;
        }

        // ════════════════════════════════════════════════════════════
        // Phase 2: Backtracking phase — decision tree from current state
        // ════════════════════════════════════════════════════════════

        let candidates = getSortedCandidates();
        if (!candidates.length) {
            // No moves at start of phase 2 — undo greedy and fail
            for (let i = greedyUndos.length - 1; i >= 0; i--) undoMove(greedyUndos[i]);
            moveSequence.length = 0;
            movePath.length = 0;
            return null;
        }

        let move = candidates[0];
        let undo = applyMove(move);
        moveSequence.push(move.type);
        movePath.push({...move});
        totalSteps++;
        nodesExplored++;
        stack.push({ candidates, index: 0, undo, move });

        while (stack.length > 0 && totalSteps <= MAX_SOLVER_STEPS) {
            // Check win
            if (state.completedCount >= state.numCategories) {
                const stepsUsed = maxSteps - state.stepsLeft;
                const ms = emptyMoveStats();
                for (const mt of moveSequence) {
                    const cat = classifyMove(mt);
                    if (cat) ms[cat]++;
                }
                const resultPath = [...movePath];
                // Undo backtracking stack
                for (let i = stack.length - 1; i >= 0; i--) undoMove(stack[i].undo);
                // Undo greedy phase
                for (let i = greedyUndos.length - 1; i >= 0; i--) undoMove(greedyUndos[i]);
                moveSequence.length = 0;
                movePath.length = 0;
                return { won: true, stepsUsed, moveStats: ms, nodesExplored, movePath: resultPath };
            }

            const depth = stack.length;

            // Too many consecutive flips or flip-drags → treat as dead end, backtrack
            if (tooManyConsecutiveFlips(moveSequence) || tooManyFlipDrags(moveSequence)) {
                // fall through to backtrack
            } else if (depth < MAX_TREE_DEPTH) {
                candidates = getSortedCandidates();
                if (candidates.length > 0) {
                    move = candidates[0];
                    undo = applyMove(move);
                    moveSequence.push(move.type);
                    movePath.push({...move});
                    totalSteps++;
                    nodesExplored++;
                    stack.push({ candidates, index: 0, undo, move });
                    continue;
                }
            } else {
                const playout = greedyPlayout();
                if (playout.won) {
                    const stepsUsed = maxSteps - state.stepsLeft;
                    const ms = emptyMoveStats();
                    for (const mt of [...moveSequence, ...playout.mtypes]) {
                        const cat = classifyMove(mt);
                        if (cat) ms[cat]++;
                    }
                    const resultPath = [...movePath, ...playout.mdicts];
                    for (let i = playout.undos.length - 1; i >= 0; i--) undoMove(playout.undos[i]);
                    // Undo backtracking stack
                    for (let i = stack.length - 1; i >= 0; i--) undoMove(stack[i].undo);
                    // Undo greedy phase
                    for (let i = greedyUndos.length - 1; i >= 0; i--) undoMove(greedyUndos[i]);
                    moveSequence.length = 0;
                    movePath.length = 0;
                    return { won: true, stepsUsed, moveStats: ms, nodesExplored, movePath: resultPath };
                } else {
                    for (let i = playout.undos.length - 1; i >= 0; i--) undoMove(playout.undos[i]);
                }
            }

            // Backtrack
            while (stack.length > 0) {
                const node = stack[stack.length - 1];
                const nextIdx = node.index + 1;
                if (nextIdx < node.candidates.length) {
                    undoMove(node.undo);
                    moveSequence.pop();
                    movePath.pop();
                    node.index = nextIdx;
                    const nextMove = node.candidates[nextIdx];
                    const nextUndo = applyMove(nextMove);
                    moveSequence.push(nextMove.type);
                    movePath.push({...nextMove});
                    totalSteps++;
                    nodesExplored++;
                    node.undo = nextUndo;
                    node.move = nextMove;
                    break;
                } else {
                    undoMove(node.undo);
                    moveSequence.pop();
                    movePath.pop();
                    stack.pop();
                }
            }
        }

        // Clean up remaining stack
        for (let i = stack.length - 1; i >= 0; i--) undoMove(stack[i].undo);
        // Undo greedy phase
        for (let i = greedyUndos.length - 1; i >= 0; i--) undoMove(greedyUndos[i]);

        return null;
    }

    // ── Greedy-only mode: single pass, no backtracking ──
    if (greedyOnly) {
        seedRng(42);
        seenSinceDrag.clear();
        const playoutPath = [];
        let playoutSteps = 0;
        const maxPlayoutSteps = 300;
        while (state.stepsLeft > 0 && playoutSteps < maxPlayoutSteps) {
            if (state.completedCount >= state.numCategories) break;
            let moves = getMoves();
            if (!moves.length) break;
            moves.sort((a, b) => {
                const dw = getPriorityWeight(b) - getPriorityWeight(a);
                if (dw !== 0) return dw;
                return getTiebreakKey(a) - getTiebreakKey(b);
            });
            const topW = getPriorityWeight(moves[0]);
            const topTB = getTiebreakKey(moves[0]);
            let topCount = 1;
            while (topCount < moves.length && getPriorityWeight(moves[topCount]) === topW && getTiebreakKey(moves[topCount]) === topTB) topCount++;
            const move = moves[Math.floor(rng() * topCount)];
            playoutPath.push({ ...move });
            applyMove(move);
            playoutSteps++;
            // Soft deadlock tracking
            if (move.type === 'flip_hand') {
                if (state.handDisplay.length > 0) {
                    seenSinceDrag.add(state.handDisplay[state.handDisplay.length - 1]);
                }
                if (isSoftDeadlock()) break;
            } else if (move.type !== 'recycle') {
                seenSinceDrag.clear();
            }
        }
        const won = state.completedCount >= state.numCategories;
        const stepsUsed = maxPlayoutSteps - state.stepsLeft + (state.stepsLeft > 0 ? state.stepsLeft : 0);
        return {
            won,
            stepsUsed: playoutSteps,
            moveStats: (() => {
                const ms = emptyMoveStats();
                for (const m of playoutPath) {
                    const cat = classifyMove(m.type);
                    if (cat) ms[cat]++;
                }
                return ms;
            })(),
            strategyType: 'priority-greedy',
            nodesExplored: playoutSteps,
            movePath: playoutPath,
        };
    }

    // Multi-round: Priority Strategy (up to MAX_SOLVER_ROUNDS)
    for (let r = 0; r < MAX_SOLVER_ROUNDS; r++) {
        seedRng(r * 1000003 + 42);  // Different seed each round
        let result = solveWithBacktracking(true);
        if (result && result.won) {
            result.strategyType = 'priority';
            return result;
        }
    }

    // Multi-round: Equality Strategy (up to MAX_SOLVER_ROUNDS) — skip if priorityOnly
    if (!priorityOnly) {
    for (let r = 0; r < MAX_SOLVER_ROUNDS; r++) {
        seedRng(r * 1000003 + 99);  // Different seed each round
        let result = solveWithBacktracking(false);
        if (result && result.won) {
            result.strategyType = 'equality';
            return result;
        }
    }
    }

    // If priorityOnly and failed, do a 300-step greedy playout for diagnostic output
    if (priorityOnly) {
        seedRng(777);  // Fixed seed for reproducible greedy playout
        // Reset state for greedy playout
        state.tableau = tableau.map(col => col.map(tc => ({ card: { ...tc.card }, faceUp: tc.faceUp })));
        state.slots = new Array(maxSlots).fill(null);
        state.stepsLeft = 300;
        state.completedCount = 0;
        state.numCategories = Object.keys(categoryTargets).length;
        state.handPile = handPile.map(c => ({ ...c }));
        state.handDisplay = [];
        state.recycleCount = 0;

        const playoutPath = [];
        let playoutSteps = 0;
        while (state.stepsLeft > 0 && playoutSteps < 300) {
            if (state.completedCount >= state.numCategories) break;
            let moves = getMoves();
            if (!moves.length) break;
            moves.sort((a, b) => {
                const dw = getPriorityWeight(b) - getPriorityWeight(a);
                if (dw !== 0) return dw;
                return getTiebreakKey(a) - getTiebreakKey(b);
            });
            const topW = getPriorityWeight(moves[0]);
            const topTB = getTiebreakKey(moves[0]);
            let topCount = 1;
            while (topCount < moves.length && getPriorityWeight(moves[topCount]) === topW && getTiebreakKey(moves[topCount]) === topTB) topCount++;
            const move = moves[Math.floor(rng() * topCount)];
            playoutPath.push({ ...move });
            applyMove(move);
            playoutSteps++;
        }
        const won = state.completedCount >= state.numCategories;
        return {
            won,
            stepsUsed: playoutSteps,
            moveStats: emptyMoveStats(),
            strategyType: 'priority-greedy',
            nodesExplored,
            movePath: playoutPath,
        };
    }

    return {
        won: false,
        stepsUsed: -1,
        moveStats: emptyMoveStats(),
        strategyType: 'none',
